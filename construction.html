<style>
/* Shell + sidebar: page-local in every Backstage tool (not in backstage.css),
   carried over verbatim from pipeline.html. */
.app-shell { display:flex; height:100vh; }

.bs-sidebar.collapsed .side-brand span, .bs-sidebar.collapsed .side-section-label, .bs-sidebar.collapsed .side-label, .bs-sidebar.collapsed .side-user-name, .bs-sidebar.collapsed .lock-btn { display:none; }
.bs-sidebar.collapsed .side-brand { justify-content:center; padding:20px 0 18px; }
.bs-sidebar.collapsed .side-item { justify-content:center; padding:10px 0; margin:0 8px 1px; }
.bs-sidebar.collapsed .side-section { padding:12px 0 0; }
.bs-sidebar.collapsed .side-footer { justify-content:center; padding:16px 0; }
.bs-sidebar.collapsed .side-user { justify-content:center; }
.side-brand { padding:20px 20px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
.side-mark { width:26px; height:26px; border-radius:7px; background:var(--text); display:grid; place-items:center; font-weight:700; font-size:11px; color:#fff; }

.side-item:hover { background:var(--bg-page); text-decoration:none; }
.side-item.active { background:var(--bg-alt); }
.side-item.active .side-icon svg { stroke:var(--text); }

.side-user-name { font-size:13px; font-weight:500; color:var(--text-3); }

.app-shell { min-height:100vh; height:auto; }
.main-content { flex:1; min-width:0; padding:20px 24px 70px; max-width:1400px; }

/* === CONSTRUCTION HUB === */
.hdr { display:flex; align-items:baseline; gap:11px; margin-bottom:14px; flex-wrap:wrap; }
.hdr h1 { font-size:20px; font-weight:600; letter-spacing:-.01em; }

button.btn { font:inherit; font-size:12px; padding:4px 10px; border:1px solid var(--border);
  background:var(--bg); border-radius:var(--radius-sm); cursor:pointer; color:var(--text-2); }
button.btn:hover { border-color:var(--border-hover); }
.sw { display:inline-flex; border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; }
.sw button { border:none; border-radius:0; }
.sw button.on { background:var(--bg-alt); color:var(--text); font-weight:600; }
h2 { font-size:14.5px; font-weight:600; }
.sh { display:flex; align-items:baseline; gap:9px; margin:22px 0 9px; }

.datenav { display:inline-flex; align-items:center; gap:5px; }

.cur { font-size:12.5px; font-weight:600; min-width:126px; text-align:center; color:var(--text-2); }
.card { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-lg);

.r { display:grid; gap:1px; align-items:stretch; }
.lb { font-size:12px; color:var(--text-2); display:flex; align-items:center; gap:5px;
  padding-right:8px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.cw { font-size:9.5px; color:var(--text-4); background:var(--bg-alt); border-radius:3px;
  padding:1px 4px; flex-shrink:0; }
.tag { font-size:9.5px; color:var(--amber); background:var(--amber-bg); border-radius:3px;
  padding:1px 5px; font-weight:700; }
.hd { font-size:8.5px; color:var(--text-4); text-align:center; line-height:1.15; padding:2px 0; }
.hd em { display:block; font-style:normal; font-size:8px; }
.hd.sun { color:var(--amber); } .hd.t0 { color:var(--red); font-weight:700; }
.cellw { position:relative; min-height:20px; }
.mon { position:absolute; left:-1px; top:-2px; bottom:-2px; width:1px; background:var(--border-strong); opacity:.4; }
.bar { height:14px; margin-top:3px; border-radius:2px; font-size:9px; font-weight:700;

.dcell { height:17px; margin-top:2px; border-radius:2px; background:var(--bg-alt); cursor:pointer;

.dcell:hover { outline:1px solid var(--border-strong); outline-offset:-1px; }
.dcell.off { background:var(--bg-alt); }
.dcell.off:hover { outline:1px solid var(--border-strong); outline-offset:-1px; }

.chip { font-size:8.5px; font-weight:700; padding:0 3px; border-radius:2px;

.ph { grid-column:1/-1; display:flex; align-items:baseline; gap:9px; padding:13px 0 4px; font-size:12px; flex-wrap:wrap; }
.ph .nm { font-weight:600; } .ph .meta { color:var(--text-4); font-size:11px; }

.ph .stale { color:var(--amber); font-weight:600; font-size:11px; }
.car { cursor:pointer; color:var(--text-4); font-size:11px; user-select:none; padding:0 2px; }
.car:hover { color:var(--text-2); }
.replan { display:inline-flex; align-items:center; gap:4px; margin-left:auto; }
.replan input { font:inherit; font-size:11px; padding:2px 5px; border:1px solid var(--border);
  border-radius:4px; background:var(--bg); color:var(--text-2); }
.replan button.clr { border-color:var(--border); background:var(--bg); color:var(--text-4); font-weight:400; }
.replan button.clr:hover { border-color:var(--border-hover); color:var(--text-2); }
.replan button { font:inherit; font-size:11px; padding:2px 8px; border:1px solid var(--accent);

.n.over { background:var(--red-bg); color:var(--red); }
.n.zero { background:none; color:var(--text-4); font-weight:400; }
.cols { display:grid; grid-template-columns:1.15fr 1fr; gap:24px; align-items:start; }
.cols > div { min-width:0; }
@media (max-width:1180px){ .cols { grid-template-columns:1fr; } }
.site { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:13px 16px; margin-bottom:10px; }
.site.sub { border-style:dashed; }
.sitehd { display:flex; align-items:flex-start; gap:11px; margin-bottom:9px; }
.sitehd .a { font-size:14px; font-weight:600; }
.sitehd .a a { color:inherit; text-decoration:none; }
.sitehd .a a:hover { color:var(--accent); }
.sitehd .a .c { font-weight:400; color:var(--text-3); }
.sitehd .m { font-size:11.5px; color:var(--text-4); margin-top:2px; }
.sitehd .rr { margin-left:auto; text-align:right; font-size:11.5px; color:var(--text-4); }
.sitehd .rr .cost { font-size:14px; font-weight:600; color:var(--text); }
.tr { display:grid; grid-template-columns:180px 58px 1fr; gap:9px; align-items:start;
  padding:6px 0; border-top:1px solid var(--border); }
.tr:first-of-type { border-top:none; }
.tr .tn { font-size:12.5px; color:var(--text-2); }
.tr .tn em { font-style:normal; font-size:10px; color:var(--text-4); display:block; }
.offtag { font-size:9px; font-weight:700; color:var(--accent); background:var(--accent-dim2);
  border-radius:3px; padding:1px 4px; margin-left:4px; }
.need { font-size:11px; color:var(--text-4); padding-top:2px; }
.need.met { color:var(--green); font-weight:700; } .need.short { color:var(--amber); font-weight:700; }
.chips { display:flex; flex-wrap:wrap; gap:4px; }
.pc { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; padding:2px 7px;
  border-radius:20px; background:var(--bg-alt); color:var(--text-2); }
.pc .rt { color:var(--text-4); font-size:10px; } .pc .x { cursor:pointer; color:var(--text-4); }
.pc .x:hover { color:var(--red); } .pc.dbl { background:var(--red-bg); color:var(--red); }
.addb { font-size:11.5px; padding:2px 8px; border-radius:20px; border:1px dashed var(--border-hover);
  color:var(--text-4); background:none; cursor:pointer; font-family:inherit; }
.addb:hover { border-color:var(--accent); color:var(--accent); }
.bench { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:13px 16px; margin-top:10px; }
.bench .pc { background:var(--green-bg); color:#1F6338; }
.rs-row { display:grid; gap:2px; align-items:center; }
.rs-h { font-size:8.5px; color:var(--text-4); text-align:center; writing-mode:vertical-rl;
  transform:rotate(180deg); height:60px; margin:0 auto; }
.rs-c { height:17px; border-radius:3px; background:var(--bg-alt); cursor:pointer; }
.rs-c:hover { outline:1px solid var(--border-strong); outline-offset:-1px; }
.rs-c.on { background:var(--accent); }
.note { font-size:11.5px; color:var(--text-4); margin-top:9px; } .note.warn { color:var(--red); }
.empty { font-size:13px; color:var(--text-4); font-style:italic; padding:26px 0; text-align:center; }
.ov { position:fixed; inset:0; background:rgba(26,26,24,.35); display:none; align-items:center;
  justify-content:center; z-index:50; }
.ov.open { display:flex; }
.ovc { background:var(--bg); border-radius:var(--radius-lg); width:390px; max-height:76vh;
  display:flex; flex-direction:column; box-shadow:var(--shadow-lg); }
.ovh { padding:13px 17px; border-bottom:1px solid var(--border); font-size:14px; font-weight:600;
  display:flex; align-items:center; }
.ovh .x { margin-left:auto; border:none; background:none; cursor:pointer; color:var(--text-4); font-size:15px; }
.ovs { font-size:11.5px; color:var(--text-4); font-weight:400; margin-top:2px; }
.ovb { overflow-y:auto; padding:5px 0; }
.wr { display:flex; align-items:center; gap:9px; padding:8px 17px; cursor:pointer; font-size:13px; }
.wr:hover { background:var(--bg-page); } .wr .nm { font-weight:500; }
.wr .rt { margin-left:auto; font-size:11.5px; color:var(--text-4); }
.wr .st { font-size:11px; color:var(--amber); }
.wr.on { background:var(--accent-dim); } .wr.on .nm { color:var(--accent); font-weight:700; }
</style>

<body>
<div class="app-shell">
<div class="bs-sidebar" id="bsSidebar"></div>
<div class="main-content">
  <div class="hdr">
    <h1>Construction</h1><span class="sub" id="hsub"></span>
    <div class="right">
      <span class="sw"><button class="btn on" id="v2w">2 weeks</button><button class="btn" id="vfull">Full runway</button></span>
    </div>
  </div>
  <div id="page"><div class="empty">Loading…</div></div>
</div>
</div>
<div class="ov" id="ov"><div class="ovc">
  <div class="ovh"><div><span id="ovt"></span><div class="ovs" id="ovs"></div></div>
    <button class="x" onclick="closeOv()">&#10005;</button></div>
  <div class="ovb" id="ovb"></div>
</div></div>
<script>
const SUPABASE_URL='https://pwrnywsojomrygsiezzi.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3cm55d3Nvam9tcnlnc2llenppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyMzE1OTMsImV4cCI6MjA4OTgwNzU5M30.tGewn18t-6dN_bMXjC-Z820zFYvL1VUu3BDhfW1ZoNk';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
window.sb=sb;

// Dates are pinned to the jobsite, not the browser. Planning "tomorrow" from
// Taipei is 15 hours ahead of Cerritos and would otherwise write the wrong day.
const TZ='America/Los_Angeles';
const _fmtLA=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
function todayStr(){return _fmtLA.format(new Date());}
function d(s){return new Date(s+'T00:00:00');}
function addDays(s,n){const x=d(s);x.setDate(x.getDate()+n);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function diff(a,b){if(!a||!b)return null;return Math.round((d(b)-d(a))/86400000);}
const DOW='SMTWTFS', MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYNAME=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function md(s){return s?(d(s).getMonth()+1)+'/'+d(s).getDate():'—';}
function longd(s){return DAYNAME[d(s).getDay()]+' '+MON[d(s).getMonth()]+' '+d(s).getDate();}
function money(n){return n==null||!isFinite(n)?'—':'$'+Math.round(n).toLocaleString();}
function titleCase(s){return String(s||'').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"})[c]);}

let TODAY=todayStr();
let deals=[], propByMls={}, tpl=[], milestones=[], workers=[], skills=[], assigns=[], costs={}, crews=[];
let sel=TODAY, view='2w', collapsed={}, ovCtx=null;
const COL=[['#EFEFEE','#5F5E5A'],['#E1F2EC','#12604A'],['#EDEBFA','#3D3593'],['#FAECE7','#993C1D']];

async function loadAll(){
  const {data:cr}=await sb.from('crews').select('id, name, kind, active');
  crews=cr||[];
  const {data:dl}=await sb.from('deals')
    .select('id, buy_side_mls, construction_start_date, actual_close_date, crew_id, plan_baselined_at')
    .eq('phase','under_construction');
  deals=(dl||[]).filter(x=>startOf(x)).sort((a,b)=>startOf(a)<startOf(b)?-1:1);
  deals.forEach((x,i)=>{x._i=i; if(!(x.id in collapsed))collapsed[x.id]=!isOurs(x);});

  const mlss=deals.map(x=>x.buy_side_mls).filter(Boolean);
  if(mlss.length){
    const {data:p}=await sb.from('properties').select('mls, address, city').in('mls',mlss);
    propByMls={}; for(const r of (p||[]))propByMls[r.mls]=r;
  }
  const {data:t}=await sb.from('escrow_milestone_templates')
    .select('milestone_key, display_name, default_offset_days, default_duration_days, default_crew_size, category, display_order')
    .eq('template_key','construction_v2').order('display_order');
  tpl=t||[];

  const ids=deals.map(x=>x.id);
  if(ids.length){
    const {data:m}=await sb.from('deal_milestones')
      .select('deal_id, milestone_key, display_name, due_date, completed, not_applicable, planned_start, planned_end')
      .in('deal_id',ids);
    milestones=m||[];
    const {data:c}=await sb.from('v_deal_cost_breakdown')
      .select('deal_id, rehab_budget, rehab_actual').in('deal_id',ids);
    costs={}; for(const r of (c||[]))costs[r.deal_id]=r;
  }
  const {data:w}=await sb.from('workers').select('id, name, daily_rate').eq('active',true).order('name');
  workers=w||[];
  const {data:sk}=await sb.from('worker_trades').select('id, worker_id, milestone_key');
  skills=sk||[];
  await loadAssignments();
}
// Assignments across the whole visible window, so the Assigned row shows what
// is already covered ahead — not just the day on screen.
async function loadAssignments(){
  const D=days(), lo=[D[0],sel].sort()[0], hi=[D[D.length-1],sel].sort().slice(-1)[0];
  const {data:a}=await sb.from('deal_work_assignments')
    .select('id, deal_id, milestone_key, work_date, worker_id').gte('work_date',lo).lte('work_date',hi);
  assigns=a||[];
}

function startOf(x){return x.construction_start_date||x.actual_close_date;}
function crewOf(x){return crews.find(c=>c.id===x.crew_id)||null;}
function isOurs(x){const c=crewOf(x);return !c||c.kind==='own';}
function crewName(x){const c=crewOf(x);return c?c.name:'Dotty crew';}
function ourDeals(){return deals.filter(isOurs);}
function tplOf(k){return tpl.find(t=>t.milestone_key===k)||{};}
function addrOf(x){const p=propByMls[x.buy_side_mls]||{};return p.address?titleCase(p.address):(x.buy_side_mls||'—');}
function cityOf(x){const p=propByMls[x.buy_side_mls]||{};return titleCase(p.city||'');}
function nameOf(m){return m.display_name||tplOf(m.milestone_key).display_name||m.milestone_key;}
// What to say about someone already booked that day. On the SAME build the
// useful fact is WHICH TRADE — naming the site would just repeat the header
// you're looking at. On a different build it's the site.
function tradeNameOf(dealId,key){
  const m=milestones.find(x=>x.deal_id===dealId&&x.milestone_key===key);
  return m?nameOf(m):(tplOf(key).display_name||key);
}
function workerById(id){return workers.find(w=>w.id===id)||null;}
function canDo(wid,key){return skills.some(s=>s.worker_id===wid&&s.milestone_key===key);}
function staffedTrades(){return tpl.filter(t=>t.category!=='procurement'&&(t.default_crew_size||0)>0);}

// A trade's span. The COMMITTED plan wins where one exists; otherwise fall
// back to the baseline span the template implies off due_date. Deliberately
// NOT rolled forward to today on the fly — a plan that re-anchors every page
// load never shows a stalled build as stalled.
function spanOf(deal, m){
  if(m.planned_start && m.planned_end)return {s:m.planned_start, e:m.planned_end, planned:true};
  const t=tplOf(m.milestone_key);
  const dur=Math.max(t.default_duration_days||0,1);
  const e=m.due_date||null;
  if(!e)return null;
  return {s:addDays(e,-(dur-1)), e, planned:false};
}
function openTrades(deal){
  return milestones.filter(m=>m.deal_id===deal.id && tplOf(m.milestone_key).milestone_key
      && tplOf(m.milestone_key).category!=='procurement'
      && (tplOf(m.milestone_key).default_duration_days||0)>0
      && !m.completed && !m.not_applicable)
    .sort((a,b)=>(tplOf(a.milestone_key).display_order||0)-(tplOf(b.milestone_key).display_order||0));
}
function doneTrades(deal){
  return milestones.filter(m=>m.deal_id===deal.id && m.completed
      && tplOf(m.milestone_key).milestone_key            // in the construction template at all
      && tplOf(m.milestone_key).category!=='procurement')
    .sort((a,b)=>(tplOf(a.milestone_key).display_order||0)-(tplOf(b.milestone_key).display_order||0));
}
function finishOf(deal){
  const sp=openTrades(deal).map(m=>spanOf(deal,m)).filter(Boolean).map(x=>x.e).sort();
  return sp.length?sp[sp.length-1]:null;
}
function baselineOf(deal){const s=startOf(deal);return s?addDays(s,36):null;}
function runningOn(deal, day){
  return openTrades(deal).filter(m=>{const sp=spanOf(deal,m);return sp&&sp.s<=day&&day<=sp.e;});
}
function demandOn(deal, day){
  let n=0; for(const m of runningOn(deal,day))n+=(tplOf(m.milestone_key).default_crew_size||0);
  return n;
}
function assignedTo(dealId,key,day){
  return assigns.filter(a=>a.deal_id===dealId&&a.milestone_key===key&&a.work_date===(day||sel))
    .map(a=>({a,w:workerById(a.worker_id)})).filter(x=>x.w);
}
function busyOn(wid,day){return assigns.filter(a=>a.worker_id===wid&&a.work_date===day).length;}
function days(){
  if(view==='2w')return Array.from({length:14},(_,i)=>addDays(TODAY,i));
  let last=TODAY;
  for(const dl of deals){const f=finishOf(dl); if(f&&f>last)last=f;}
  const n=Math.max(13, diff(TODAY,last)||13);
  return Array.from({length:n+1},(_,i)=>addDays(TODAY,i));
}

function render(){
  const D=days(), N=D.length;
  const gt=`grid-template-columns:196px repeat(${N},minmax(${view==='2w'?'34':'19'}px,1fr))`;
  document.getElementById('hsub').textContent=
    deals.length+(deals.length===1?' build':' builds')+' · '+ourDeals().length+' on our crew';
  document.getElementById('v2w').classList.toggle('on',view==='2w');
  document.getElementById('vfull').classList.toggle('on',view==='full');
  if(!deals.length){document.getElementById('page').innerHTML='<div class="empty">No builds under construction.</div>';return;}

  let hd=`<div class="r" style="${gt}"><span class="lb"></span>`;
  for(const x of D){const dow=d(x).getDay();
    const lab=x===TODAY?'today':((view==='2w'||dow===1)?md(x):'');
    hd+=`<span class="hd${dow===0?' sun':''}${x===TODAY?' t0':''}"><em>${DOW[dow]}</em>${lab}</span>`;}
  hd+='</div>';

  let body='';
  for(const deal of deals){
    const [bg,fg]=COL[deal._i%COL.length];
    const open=openTrades(deal), done=doneTrades(deal);
    const fin=finishOf(deal), base=baselineOf(deal);
    const over=(fin&&base)?diff(base,fin):null;
    const anyPlanned=open.some(m=>m.planned_start);
    const c=costs[deal.id]||{};
    const bud=(c.rehab_budget&&c.rehab_budget>0)?Math.round((c.rehab_actual||0)/c.rehab_budget*100):0;
    const col=!!collapsed[deal.id];
    body+=`<div class="ph"><span class="car" onclick="toggleCollapse('${deal.id}')">${col?'▸':'▾'}</span>
      <span><span class="dot" style="background:${fg}"></span><span class="nm">${esc(addrOf(deal))}</span>
      ${isOurs(deal)?'':'<span class="tag">'+esc(crewName(deal))+'</span>'}</span>
      <span class="meta">done: ${done.length?done.map(m=>esc(nameOf(m))).join(' · '):'nothing marked complete yet'}</span>
      <span class="meta">rehab ${money(c.rehab_actual||0)} of ${c.rehab_budget?money(c.rehab_budget):'—'} · ${bud}%</span>
      ${fin?(anyPlanned
        ? `<span class="slip">finishes ${md(fin)}${over>0?' — '+over+' past baseline':''}</span>`
        : `<span class="stale">baseline ran to ${md(fin)} — no committed plan, re-plan to schedule the rest</span>`):''}
      ${(anyPlanned&&deal.plan_baselined_at)?`<span class="meta">planned ${md(String(deal.plan_baselined_at).slice(0,10))}</span>`:''}
      <span class="replan"><input type="date" id="rb-${deal.id}" value="${TODAY}">
        <button onclick="rebaseline('${deal.id}')">Re-plan</button>
        ${anyPlanned?`<button class="clr" onclick="clearPlan('${deal.id}')" title="Back to baseline dates">Clear</button>`:''}
      </span></div>`;

    if(col){
      const ss=open.map(m=>spanOf(deal,m)).filter(Boolean);
      const s0=ss.map(x=>x.s).sort()[0], e0=ss.map(x=>x.e).sort().slice(-1)[0];
      let cs='';
      for(const x of D){
        const mon=d(x).getDay()===1?'<span class="mon"></span>':'';
        cs+=(s0&&s0<=x&&x<=e0)
          ? `<span class="cellw">${mon}<div class="bar" style="background:${bg};color:${fg}">${x===s0||x===D[0]?open.length+' trades':''}</div></span>`
          : `<span class="cellw">${mon}<div class="rcell"></div></span>`;
      }
      body+=`<div class="r" style="${gt}"><span class="lb" style="color:var(--text-4);font-style:italic">${isOurs(deal)?'collapsed':'not our labour'}</span>${cs}</div>`;
      continue;
    }

    for(const m of open){
      const t=tplOf(m.milestone_key), sp=spanOf(deal,m);
      const crew=t.default_crew_size==null?0:t.default_crew_size;
      let cells='';
      for(const x of D){
        const mon=d(x).getDay()===1?'<span class="mon"></span>':'';
        const on=sp&&sp.s<=x&&x<=sp.e;
        if(view==='full'){
          cells+=on?`<span class="cellw">${mon}<div class="bar" style="background:${bg};color:${fg}">${x===sp.s&&crew?crew:''}</div></span>`
                  :`<span class="cellw">${mon}<div class="rcell"></div></span>`;
          continue;
        }
        const who=assignedTo(deal.id,m.milestone_key,x);
        const clickable=(isOurs(deal)&&crew)?` onclick="openOv('${deal.id}','${esc(m.milestone_key)}','${x}')"`:'';
        const inner=who.length
          ? who.map(p=>`<span class="chip" style="color:${fg}">${esc(p.w.name.slice(0,2))}</span>`).join('')
          : (on?(crew?`<span class="chip" style="color:${fg};background:none;opacity:.55">${crew}</span>`
                     :'<span class="chip" style="background:none;color:#9b9b95;font-weight:400">s</span>'):'');
        const cls='dcell'+(on?'':' off')+((who.length&&!on)?' extra':'');
        cells+=`<span class="cellw">${mon}<div class="${cls}" style="${on?'background:'+bg:''}"${clickable}>${inner}</div></span>`;
      }
      body+=`<div class="r" style="${gt}"><span class="lb">${esc(nameOf(m))} <span class="cw">${crew?crew+'p':'sub'}</span></span>${cells}</div>`;
    }
  }

  let ld=`<div class="r load" style="${gt}"><span class="lb">Crew needed</span>`;
  for(const x of D){let v=0;for(const dl of ourDeals())v+=demandOn(dl,x);
    ld+=`<span class="n${v>workers.length?' over':(v?'':' zero')}">${v||''}</span>`;}
  ld+='</div>';
  let ac=`<div class="r" style="${gt}"><span class="lb">Assigned</span>`;
  for(const x of D){const v=assigns.filter(a=>a.work_date===x).length;
    let need=0;for(const dl of ourDeals())need+=demandOn(dl,x);
    ac+=`<span class="n zero" style="${v&&v<need?'color:var(--amber);font-weight:700':(v?'color:var(--green);font-weight:700':'')}">${v||''}</span>`;}
  ac+='</div>';

  // ---- day panel ----
  let sites='',subs='',dayCost=0;
  for(const deal of deals){
    const planned=runningOn(deal,sel);
    const onKeys=new Set(assigns.filter(a=>a.deal_id===deal.id&&a.work_date===sel).map(a=>a.milestone_key));
    const extra=milestones.filter(m=>m.deal_id===deal.id&&onKeys.has(m.milestone_key)
      &&!planned.some(x=>x.milestone_key===m.milestone_key));
    // Only trades someone is actually on. A planned trade with nobody on it is
    // already stated by the Crew needed / Assigned rows above; repeating it here
    // as "0 / 2" made the panel mostly empty rows. To put the first person on a
    // trade, click its day cell in the grid.
    const all=[...planned.map(m=>({m,off:false})), ...extra.map(m=>({m,off:true}))];
    if(!isOurs(deal)){
      if(!all.length)continue;
      subs+=`<div class="site sub"><div class="sitehd"><div>
        <div class="a"><a href="project-detail.html?deal=${deal.id}">${esc(addrOf(deal))}</a>, <span class="c">${esc(cityOf(deal))}</span> <span class="tag">${esc(crewName(deal))}</span></div>
        <div class="m">day ${diff(startOf(deal),sel)} · ${all.map(x=>esc(nameOf(x.m))).join(' · ')}</div></div>
        <div class="rr" style="color:var(--amber);font-weight:700">fixed price<div style="font-weight:400;color:var(--text-4)">not staffed from our roster</div></div>
      </div></div>`; continue;
    }
    const tr=all.filter(x=>assignedTo(deal.id,x.m.milestone_key,sel).length>0);
    if(!tr.length)continue;
    let rows='',cost=0,got=0;
    // The plan's ask counts every planned trade, staffed or not — otherwise
    // hiding the empty rows would also hide the shortfall they represent.
    let need=0; for(const x of planned)need+=(tplOf(x.milestone_key).default_crew_size||0);
    for(const {m,off} of tr){
      const t=tplOf(m.milestone_key), crew=t.default_crew_size||0, sp=spanOf(deal,m);
      const who=assignedTo(deal.id,m.milestone_key,sel);
      got+=who.length;
      for(const p of who)cost+=Number(p.w.daily_rate||0);
      const cls=off?'':(crew?(who.length>=crew?'met':'short'):'');
      rows+=`<div class="tr"><div class="tn">${esc(nameOf(m))}${off?' <span class="offtag">off plan</span>':''}<em>${sp?(sp.s===sp.e?md(sp.s):md(sp.s)+' – '+md(sp.e)):''}</em></div>
        <div class="need ${cls}">${who.length}${(crew&&!off)?' / '+crew:''}</div>
        <div class="chips">${who.map(p=>{const db=busyOn(p.w.id,sel)>1;
          return `<span class="pc${db?' dbl':''}">${esc(p.w.name)}<span class="rt">${money(p.w.daily_rate)}</span><span class="x" onclick="unassign('${p.a.id}')">&#10005;</span></span>`;}).join('')}
          ${crew?`<button class="addb" onclick="openOv('${deal.id}','${esc(m.milestone_key)}','${sel}')">+ assign</button>`:''}</div></div>`;
    }
    dayCost+=cost;
    sites+=`<div class="site"><div class="sitehd"><div>
      <div class="a"><a href="project-detail.html?deal=${deal.id}">${esc(addrOf(deal))}</a>, <span class="c">${esc(cityOf(deal))}</span></div>
      <div class="m">day ${diff(startOf(deal),sel)} · ${tr.length} ${tr.length===1?'trade':'trades'}${extra.length?' · '+extra.length+' off plan':''}</div></div>
      <div class="rr"><div class="cost">${money(cost)}</div>${got} out · ${need} asked for by the plan</div></div>${rows}</div>`;
  }
  if(!sites)sites='<div class="site" style="text-align:center;color:var(--text-4);font-style:italic">Nothing on our crew this day.</div>';
  const out=new Set(assigns.filter(a=>a.work_date===sel).map(a=>a.worker_id));
  const bench=workers.filter(w=>!out.has(w.id));
  const dbl=workers.filter(w=>busyOn(w.id,sel)>1);

  // ---- roster ----
  const T=staffedTrades(), sgt=`grid-template-columns:88px 44px repeat(${T.length},minmax(15px,1fr))`;
  let sh=`<div class="rs-row" style="${sgt}"><span></span><span></span>`;
  for(const t of T)sh+=`<span class="rs-h" title="${esc(t.display_name)}">${esc(t.display_name.replace(/ (complete|done|installed)\b.*$/i,'').replace(/,.*$/,'').slice(0,11))}</span>`;
  sh+='</div>';
  let srows='';
  for(const w of workers){
    let cs='';
    for(const t of T)cs+=`<span class="rs-c${canDo(w.id,t.milestone_key)?' on':''}" data-skill="${w.id}|${esc(t.milestone_key)}"></span>`;
    srows+=`<div class="rs-row" style="${sgt}"><span style="font-size:12px">${esc(w.name)}</span><span style="font-size:10.5px;color:var(--text-4)">${money(w.daily_rate)}</span>${cs}</div>`;
  }

  document.getElementById('page').innerHTML=`
    <div class="sh"><h2>${view==='2w'?'The next two weeks':'Full runway'}</h2>
      <span class="sub">${view==='2w'?'every day is clickable — inside the plan or not':'the committed plan, out to the last trade'}</span></div>
    <div class="card"><div style="min-width:${196+N*(view==='2w'?34:19)}px">${hd}${body}${ld}${ac}</div></div>
    <div class="cols">
      <div>
        <div class="sh"><h2>Who goes where</h2><span class="sub">${dayCost?money(dayCost)+' in crew labour':''}</span>
          <span class="act datenav">
            <button class="btn" onclick="step(-1)">&lsaquo;</button>
            <span class="cur">${longd(sel)}</span>
            <button class="btn" onclick="step(1)">&rsaquo;</button>
            <button class="btn" onclick="goDay('${TODAY}')">Today</button>
            <button class="btn" onclick="goDay('${addDays(TODAY,1)}')">Tomorrow</button>
          </span></div>
        ${sites}${subs}
        ${dbl.length?`<div class="note warn">${dbl.map(w=>esc(w.name)).join(', ')} ${dbl.length===1?'is':'are'} in two places today.</div>`:''}
      </div>
      <div>
        <div class="sh"><h2>Crew &amp; skills</h2><span class="sub">click a square to mark a trade</span></div>
        <div class="card">${sh}${srows}</div>
        <div class="bench"><div style="font-size:12px;font-weight:600;margin-bottom:6px">Not assigned <span style="font-weight:400;color:var(--text-4)">${bench.length} of ${workers.length} free on ${md(sel)}</span></div>
          <div class="chips">${bench.map(w=>`<span class="pc">${esc(w.name)}<span class="rt">${money(w.daily_rate)}</span></span>`).join('')||'<span style="font-size:12px;color:var(--text-4);font-style:italic">Everyone is out.</span>'}</div></div>
      </div>
    </div>`;
  wire();
}

function wire(){
  document.querySelectorAll('.rs-c[data-skill]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const [wid,key]=el.dataset.skill.split('|');
      const cur=skills.find(x=>x.worker_id===wid&&x.milestone_key===key);
      el.classList.toggle('on',!cur);
      if(cur){
        const {error}=await sb.from('worker_trades').delete().eq('id',cur.id);
        if(error){el.classList.add('on');alert('Save failed: '+error.message);return;}
        skills=skills.filter(x=>x.id!==cur.id);
      } else {
        const {data,error}=await sb.from('worker_trades')
          .insert({worker_id:wid, milestone_key:key}).select('id, worker_id, milestone_key');
        if(error){el.classList.remove('on');alert('Save failed: '+error.message);return;}
        if(data&&data[0])skills.push(data[0]);
      }
      render();
    });
  });
}
function toggleCollapse(id){collapsed[id]=!collapsed[id];render();}
async function step(n){sel=addDays(sel,n);await loadAssignments();render();}
async function goDay(x){sel=x;await loadAssignments();render();}
async function setView(v){view=v;await loadAssignments();render();}
window.toggleCollapse=toggleCollapse; window.step=step; window.goDay=goDay;

// Re-plan: push the remaining schedule so the earliest open trade starts on the
// chosen date. The baseline (due_date) is untouched, so how far behind the
// build is stays visible afterwards.
async function rebaseline(dealId){
  const el=document.getElementById('rb-'+dealId);
  const start=el&&el.value?el.value:TODAY;
  const deal=deals.find(x=>x.id===dealId);
  if(!confirm('Re-plan '+addrOf(deal)+' so the next unfinished trade starts '+longd(start)+'?\n\nThe original baseline is kept — this only moves the plan.'))return;
  const {data,error}=await sb.rpc('rebaseline_construction_plan',{p_deal_id:dealId, p_start:start});
  if(error){alert('Re-plan failed: '+error.message);return;}
  await loadAll(); render();
  alert('Re-planned '+data+' trades.');
}
window.rebaseline=rebaseline;

// The one thing Re-plan can't undo on its own: getting back to "no committed
// plan". Re-planning is idempotent — the shift is always derived from the
// template and the build's start date, never from the previous plan — so a
// wrong date is fixed by re-planning with the right one. This is for backing
// out of having a plan at all.
async function clearPlan(dealId){
  const deal=deals.find(x=>x.id===dealId);
  if(!confirm('Clear the committed plan for '+addrOf(deal)+'?\n\nIts trades go back to the original baseline dates. Nothing else changes.'))return;
  const {error}=await sb.from('deal_milestones')
    .update({planned_start:null, planned_end:null}).eq('deal_id',dealId);
  if(error){alert('Clear failed: '+error.message);return;}
  await sb.from('deals').update({plan_baselined_at:null}).eq('id',dealId);
  await loadAll(); render();
}
window.clearPlan=clearPlan;

async function unassign(id){
  const {error}=await sb.from('deal_work_assignments').delete().eq('id',id);
  if(error){alert('Remove failed: '+error.message);return;}
  assigns=assigns.filter(a=>a.id!==id);
  render();
}
window.unassign=unassign;

function openOv(dealId,key,day){
  ovCtx={dealId,key,day};
  const deal=deals.find(x=>x.id===dealId);
  const m=milestones.find(x=>x.deal_id===dealId&&x.milestone_key===key);
  const t=tplOf(key);
  document.getElementById('ovt').textContent=m?nameOf(m):key;
  document.getElementById('ovs').textContent=addrOf(deal)+' · '+longd(day)+' · needs '+(t.default_crew_size||0);
  renderOv();
  document.getElementById('ov').classList.add('open');
}
window.openOv=openOv;
function renderOv(){
  const here=new Set(assignedTo(ovCtx.dealId,ovCtx.key,ovCtx.day).map(x=>x.w.id));
  document.getElementById('ovb').innerHTML=workers.map(w=>{
    const el=assigns.find(a=>a.worker_id===w.id&&a.work_date===ovCtx.day
      &&!(a.deal_id===ovCtx.dealId&&a.milestone_key===ovCtx.key));
    const st=el?`<span class="st">on ${esc(el.deal_id===ovCtx.dealId
      ? tradeNameOf(el.deal_id, el.milestone_key)
      : addrOf(deals.find(x=>x.id===el.deal_id)||{}))}</span>`:'';
    const sk=canDo(w.id,ovCtx.key)?'<span class="st" style="color:var(--green)">trained for this</span>':'';
    return `<div class="wr${here.has(w.id)?' on':''}" data-worker="${w.id}">
      <span class="nm">${esc(w.name)}</span>${sk}${st}<span class="rt">${money(w.daily_rate)}</span></div>`;
  }).join('');
  document.querySelectorAll('#ovb .wr').forEach(el=>{
    el.addEventListener('click',()=>toggleWorker(el.dataset.worker));
  });
}
// In-flight guard: the write is async, so rapid clicks on one person raced and
// hit the unique constraint on (deal, trade, date, worker).
const ovBusy=new Set();
async function toggleWorker(workerId){
  const token=ovCtx.dealId+'|'+ovCtx.key+'|'+ovCtx.day+'|'+workerId;
  if(ovBusy.has(token))return;
  ovBusy.add(token);
  try{ await _toggleWorker(workerId); } finally { ovBusy.delete(token); }
}
async function _toggleWorker(workerId){
  const {dealId,key,day}=ovCtx;
  const existing=assigns.find(a=>a.deal_id===dealId&&a.milestone_key===key&&a.work_date===day&&a.worker_id===workerId);
  if(existing){
    const {error}=await sb.from('deal_work_assignments').delete().eq('id',existing.id);
    if(error){alert('Remove failed: '+error.message);return;}
    assigns=assigns.filter(a=>a.id!==existing.id);
  } else {
    const {data,error}=await sb.from('deal_work_assignments')
      .insert({deal_id:dealId, milestone_key:key, work_date:day, worker_id:workerId})
      .select('id, deal_id, milestone_key, work_date, worker_id');
    if(error){
      // Already there — assigned from project-detail, another tab, or a click
      // the guard missed. That's the state asked for, so adopt it.
      if(error.code==='23505'||/duplicate key/i.test(error.message||'')){
        const {data:again}=await sb.from('deal_work_assignments')
          .select('id, deal_id, milestone_key, work_date, worker_id')
          .eq('deal_id',dealId).eq('milestone_key',key).eq('work_date',day).eq('worker_id',workerId).limit(1);
        if(again&&again[0]&&!assigns.some(a=>a.id===again[0].id))assigns.push(again[0]);
      } else { alert('Assign failed: '+error.message); return; }
    } else if(data&&data[0]){ assigns.push(data[0]); }
  }
  renderOv(); render();
  document.getElementById('ov').classList.add('open');
}
function closeOv(){document.getElementById('ov').classList.remove('open');ovCtx=null;}
window.closeOv=closeOv;

(async()=>{
  await window.authGate();
  if(!window.CURRENT_USER_ROLE)return;
  window.renderSidebar('construction');
  document.getElementById('v2w').addEventListener('click',()=>setView('2w'));
  document.getElementById('vfull').addEventListener('click',()=>setView('full'));
  document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeOv();});
  await loadAll();
  render();
})();

</script>
</body>
</html>
