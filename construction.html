<script>
const SUPABASE_URL='https://pwrnywsojomrygsiezzi.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3cm55d3Nvam9tcnlnc2llenppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyMzE1OTMsImV4cCI6MjA4OTgwNzU5M30.tGewn18t-6dN_bMXjC-Z820zFYvL1VUu3BDhfW1ZoNk';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
window.sb=sb;

let deals=[], propByMls={}, tpl=[], milestones=[], workers=[], assigns=[], costs={}, workdays=[], skills=[], crews=[];
let selDate=todayStr();
let horizonMode='2w';   // '2w' | 'full'
const HORIZON=13;       // today + 13 = a fortnight
// Full runway = today through the last milestone on any live build. Longer,
// and the far end is a plan nobody has verified — hence two views, not one.
function horizonDays(){
  const from=todayStr();
  let n=HORIZON;
  if(horizonMode==='full'){
    let last=from;
    for(const m of milestones){ if(m.due_date&&m.due_date>last)last=m.due_date; }
    n=Math.max(HORIZON, daysBetween(from,last)||HORIZON);
  }
  const days=[];
  for(let i=0;i<=n;i++)days.push(addDays(from,i));
  return days;
}
let ovCtx=null;

function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(s,n){if(!s)return null;const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function daysBetween(a,b){if(!a||!b)return null;const x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00');
  if(!isFinite(x)||!isFinite(y))return null;return Math.round((y-x)/86400000);}
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function longDate(s){const d=new Date(s+'T00:00:00');return DOW[d.getDay()]+' '+MON[d.getMonth()]+' '+d.getDate();}
function fmtNum(s){if(!s)return '—';const p=String(s).split('-');return Number(p[1])+'/'+Number(p[2]);}
function FD(n){return n==null||!isFinite(n)?'—':'$'+Math.round(n).toLocaleString();}
function FK(n){if(n==null||!isFinite(n))return '—';if(Math.abs(n)>=1e6)return '$'+(n/1e6).toFixed(2).replace(/\.?0+$/,'')+'M';
  if(Math.abs(n)>=1e3)return '$'+Math.round(n/1e3)+'K';return '$'+Math.round(n);}
function titleCase(s){return String(s||'').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"})[c]);}

async function loadAll(){
  const {data:cr}=await sb.from('crews').select('id, name, kind, active');
  crews=cr||[];
  const {data:d}=await sb.from('deals')
    .select('id, buy_side_mls, construction_start_date, actual_close_date, gc_crew, purchase_price, crew_id')
    .eq('phase','under_construction');
  deals=(d||[]).filter(x=>x.construction_start_date||x.actual_close_date)
    .sort((a,b)=>(startOf(a)<startOf(b)?-1:1));

  const mlss=deals.map(x=>x.buy_side_mls).filter(Boolean);
  if(mlss.length){
    const {data:p}=await sb.from('properties').select('mls, address, city, beds, baths, sqft').in('mls',mlss);
    propByMls={}; for(const r of (p||[]))propByMls[r.mls]=r;
  }
  const {data:t}=await sb.from('escrow_milestone_templates')
    .select('milestone_key, display_name, default_offset_days, default_duration_days, default_crew_size, category, display_order')
    .eq('template_key','construction_v2').order('display_order');
  tpl=t||[];

  const ids=deals.map(x=>x.id);
  if(ids.length){
    const {data:m}=await sb.from('deal_milestones')
      .select('deal_id, milestone_key, display_name, due_date, completed, not_applicable').in('deal_id',ids);
    milestones=m||[];
    const {data:c}=await sb.from('v_deal_cost_breakdown')
      .select('deal_id, rehab_budget, rehab_actual').in('deal_id',ids);
    costs={}; for(const r of (c||[]))costs[r.deal_id]=r;
    const {data:wd}=await sb.from('deal_work_days')
      .select('deal_id, milestone_key, work_date, crew_count').in('deal_id',ids);
    workdays=wd||[];
  }
  const {data:w}=await sb.from('workers').select('id, name, daily_rate, active').eq('active',true).order('name');
  workers=w||[];
  const {data:sk}=await sb.from('worker_trades').select('id, worker_id, milestone_key');
  skills=sk||[];
  await loadAssignments();
}
// Assignments for the whole forward window, not just the day on screen — the
// demand matrix needs to show what's already covered across the fortnight.
async function loadAssignments(){
  const days=horizonDays();
  const from=todayStr(), to=days[days.length-1];
  const lo=selDate<from?selDate:from, hi=selDate>to?selDate:to;
  const {data:a}=await sb.from('deal_work_assignments')
    .select('id, deal_id, milestone_key, work_date, worker_id')
    .gte('work_date',lo).lte('work_date',hi);
  assigns=a||[];
}
function assignsOn(date){return assigns.filter(a=>a.work_date===date);}

function startOf(d){return d.construction_start_date||d.actual_close_date;}
// A fixed-price sub crew (Alfonso) doesn't draw on our ten people: it isn't
// scheduled per person, isn't costed per day, and must not be counted against
// roster capacity. Counting it was the difference between a peak of 19 and the
// real 11. NULL crew_id reads as our own crew.
function crewOf(d){return crews.find(c=>c.id===d.crew_id)||null;}
function isOurs(d){const c=crewOf(d);return !c||c.kind==='own';}
function crewName(d){const c=crewOf(d);return c?c.name:'Dotty crew';}
function ourDeals(){return deals.filter(isOurs);}
function subDeals(){return deals.filter(d=>!isOurs(d));}
// Trades that need our own people — the only ones a suggestion can fill.
function staffedTrades(){
  return tpl.filter(t=>t.category!=='procurement'&&(t.default_crew_size||0)>0);
}
function canDo(workerId,key){return skills.some(s=>s.worker_id===workerId&&s.milestone_key===key);}
function skilledFor(key){return workers.filter(w=>canDo(w.id,key));}
function tplOf(k){return tpl.find(t=>t.milestone_key===k)||{};}
// deal_milestones carries the name stamped at seed time; the template is the
// fallback so a row seeded before a rename never renders as a raw key.
function nameOf(m){return m.display_name||tplOf(m.milestone_key).display_name||m.milestone_key;}
function addrOf(d){const p=propByMls[d.buy_side_mls]||{};return p.address?titleCase(p.address):(d.buy_side_mls||'—');}
function cityOf(d){const p=propByMls[d.buy_side_mls]||{};return titleCase(p.city||'');}

// Trades planned at a site on a given date. A trade is planned across the
// window its template implies, ending on this deal's own due date — the same
// derivation project-detail uses, so the two pages never disagree.
function tradesOn(deal, date){
  const start=startOf(deal);
  const off=daysBetween(start, date);
  if(off==null||off<0)return [];
  const out=[];
  for(const m of milestones.filter(x=>x.deal_id===deal.id)){
    const t=tplOf(m.milestone_key);
    if(!t.milestone_key||t.category==='procurement')continue;
    if(m.not_applicable||m.completed)continue;
    const dur=t.default_duration_days||0;
    if(dur<=0)continue;
    const end=m.due_date?daysBetween(start,m.due_date):(t.default_offset_days||0);
    const s=Math.max(0,end-dur+1);
    if(off>=s&&off<=end)out.push({m,t,startDay:s,endDay:end});
  }
  return out.sort((a,b)=>(a.t.display_order||0)-(b.t.display_order||0));
}
function assignedTo(dealId, key){
  return assigns.filter(a=>a.deal_id===dealId&&a.milestone_key===key&&a.work_date===selDate)
    .map(a=>({a, w:workers.find(w=>w.id===a.worker_id)})).filter(x=>x.w);
}
function workerDayCount(workerId, date){
  return assigns.filter(a=>a.worker_id===workerId&&a.work_date===(date||selDate)).length;
}
// Crew a site needs on a date: the trades running that day, summed. Trades with
// no crew size set contribute nothing and are counted separately so the number
// never quietly reads low.
function demandOn(deal, date){
  let need=0, unknown=0;
  for(const {t} of tradesOn(deal, date)){
    if(t.default_crew_size==null)unknown++;
    else need+=t.default_crew_size;
  }
  return {need, unknown};
}

// Schedule slip for the watch-list: how far behind the oldest still-open
// milestone has fallen. Same definition project-detail uses.
function slipOf(deal){
  const start=startOf(deal);
  const ms=milestones.filter(m=>m.deal_id===deal.id&&!m.not_applicable&&tplOf(m.milestone_key).milestone_key);
  const applicable=ms.filter(m=>tplOf(m.milestone_key).category!=='procurement');
  const done=applicable.filter(m=>m.completed).length;
  const open=applicable.filter(m=>!m.completed&&m.due_date).sort((a,b)=>a.due_date<b.due_date?-1:1);
  const oldest=open[0]||null;
  const today=todayStr();
  const slip=(oldest&&oldest.due_date<today)?daysBetween(oldest.due_date,today):0;
  const last=ms.map(m=>m.due_date).filter(Boolean).sort();
  const target=last.length?last[last.length-1]:null;
  return {start, done, total:applicable.length, oldest, slip, target,
    elapsed:start?daysBetween(start,today):null,
    totalDays:(start&&target)?daysBetween(start,target):36};
}

// The forward look: sites down, the next fortnight across, each cell the crew
// that site needs that day. This is the part that makes the page a plan rather
// than a form — you see Thursday needing more people than exist while there's
// still time to do something about it.
function renderMatrix(){
  const days=horizonDays();
  const roster=workers.length;
  const gt=`grid-template-columns:132px repeat(${days.length},minmax(22px,1fr))`;

  let head=`<div class="mx-row mx-head" style="${gt}"><span class="mx-lbl"></span>`;
  for(const d of days){
    const dow=new Date(d+'T00:00:00').getDay();
    head+=`<span class="mx-c mx-h${dow===0?' sun':''}${d===selDate?' sel':''}" data-day="${d}">
      <em>${DOW[dow].slice(0,1)}</em>${fmtNum(d)}</span>`;
  }
  head+='</div>';

  let rows='';
  const totals=days.map(()=>0);
  const covered=days.map(()=>0);
  for(const deal of ourDeals()){
    let cells='';
    let any=false;
    days.forEach((d,i)=>{
      const {need,unknown}=demandOn(deal,d);
      totals[i]+=need;
      covered[i]+=assignsOn(d).filter(a=>a.deal_id===deal.id).length;
      if(need||unknown)any=true;
      const dow=new Date(d+'T00:00:00').getDay();
      cells+=`<span class="mx-c${need?' has':''}${dow===0?' sun':''}${d===selDate?' sel':''}" data-day="${d}"
        title="${esc(addrOf(deal))} · ${longDate(d)} · ${need} needed${unknown?' (+'+unknown+' trade with no crew size)':''}"
        >${need||''}</span>`;
    });
    if(!any)continue;
    rows+=`<div class="mx-row" style="${gt}"><span class="mx-lbl" title="${esc(addrOf(deal))}">${esc(addrOf(deal))}</span>${cells}</div>`;
  }
  // Sub-crew builds still appear — you need to know when they land — but with
  // no numbers, because their days aren't ours to staff.
  for(const deal of subDeals()){
    let cells='';
    days.forEach(d=>{
      const running=tradesOn(deal,d).length>0;
      const dow=new Date(d+'T00:00:00').getDay();
      cells+=`<span class="mx-c sub${running?' on':''}${dow===0?' sun':''}${d===selDate?' sel':''}" data-day="${d}"
        title="${esc(addrOf(deal))} · ${esc(crewName(deal))} · ${running?'working':'not scheduled'}"></span>`;
    });
    rows+=`<div class="mx-row" style="${gt}"><span class="mx-lbl" title="${esc(addrOf(deal))}">${esc(addrOf(deal))} <em class="crewtag">${esc(crewName(deal))}</em></span>${cells}</div>`;
  }

  let totalCells='';
  days.forEach((d,i)=>{
    const over=totals[i]>roster;
    const dow=new Date(d+'T00:00:00').getDay();
    totalCells+=`<span class="mx-c mx-t${over?' over':''}${dow===0?' sun':''}${d===selDate?' sel':''}" data-day="${d}"
      title="${totals[i]} needed of ${roster} on the roster${over?' — short by '+(totals[i]-roster):''}">${totals[i]||''}</span>`;
  });
  let coverCells='';
  days.forEach((d,i)=>{
    const dow=new Date(d+'T00:00:00').getDay();
    const short=totals[i]>0&&covered[i]<totals[i];
    coverCells+=`<span class="mx-c mx-a${short?' short':''}${covered[i]&&!short?' met':''}${dow===0?' sun':''}${d===selDate?' sel':''}"
      data-day="${d}" title="${covered[i]} assigned of ${totals[i]} needed">${covered[i]||''}</span>`;
  });

  const peak=Math.max(...totals);
  const overDays=totals.filter(t=>t>roster).length;
  const sun=days.filter((d,i)=>new Date(d+'T00:00:00').getDay()===0&&totals[i]>0).length;
  const notes=[];
  if(overDays)notes.push(`${overDays} ${overDays===1?'day needs':'days need'} more people than the ${roster} on the roster`);
  if(sun)notes.push(`${sun} ${sun===1?'Sunday has':'Sundays have'} work scheduled`);

  return `<div class="mx">
    ${head}
    ${rows}
    <div class="mx-row mx-sum" style="${gt}"><span class="mx-lbl">Needed</span>${totalCells}</div>
    <div class="mx-row mx-sum" style="${gt}"><span class="mx-lbl">Assigned</span>${coverCells}</div>
  </div>
  <div class="mx-foot">Peak ${peak} of ${roster} on the roster${notes.length?' · '+notes.join(' · '):''}. Click a day to plan it.</div>`;
}

// Roster editor: people down, the trades we staff ourselves across. Click to
// say someone can do a trade. Nothing is pre-filled — guessing who is qualified
// would invent the exact fact this table exists to record.
function renderRoster(){
  const trades=staffedTrades();
  const gt=`grid-template-columns:110px 52px repeat(${trades.length},minmax(20px,1fr))`;
  let head=`<div class="rs-row rs-head" style="${gt}"><span></span><span></span>`;
  for(const t of trades){
    head+=`<span class="rs-h" title="${esc(t.display_name)}">${esc(shortTrade(t))}</span>`;
  }
  head+='</div>';
  let rows='';
  for(const w of workers){
    let cells='';
    for(const t of trades){
      const on=canDo(w.id,t.milestone_key);
      cells+=`<span class="rs-c${on?' on':''}" data-skill="${w.id}|${esc(t.milestone_key)}"
        title="${esc(w.name)} · ${esc(t.display_name)}"></span>`;
    }
    const n=skills.filter(x=>x.worker_id===w.id).length;
    rows+=`<div class="rs-row" style="${gt}"><span class="rs-n">${esc(w.name)}</span><span class="rs-r">${FD(w.daily_rate)}</span>${cells}</div>`;
  }
  const gaps=trades.filter(t=>skilledFor(t.milestone_key).length===0);
  const thin=trades.filter(t=>{
    const n=skilledFor(t.milestone_key).length;
    return n>0 && n<(t.default_crew_size||1);
  });
  let note='';
  if(gaps.length)note+=`<div class="note warn">Nobody is marked for ${gaps.map(t=>esc(t.display_name)).join(', ')} — those trades can't be suggested.</div>`;
  if(thin.length)note+=`<div class="note">Fewer people marked than the crew size calls for: ${thin.map(t=>esc(t.display_name)+' ('+skilledFor(t.milestone_key).length+' of '+t.default_crew_size+')').join(', ')}.</div>`;
  return `<div class="rs">${head}${rows}</div>${note}`;
}
function shortTrade(t){
  return String(t.display_name||'')
    .replace(/ (complete|done|installed|pulled|ordered)\b.*$/i,'')
    .replace(/,.*$/,'')
    .replace(/ rough-in$/i,'')
    .slice(0,10);
}

// Suggest a crew for the selected day. Only ever proposes someone who is
// marked for the trade and is not already out somewhere that day. Continuity
// first — whoever has been on this trade at this site keeps it, because moving
// people mid-trade costs a day of ramp-up — then the cheapest qualified person.
function suggestFor(date){
  const taken=new Set(assigns.filter(a=>a.work_date===date).map(a=>a.worker_id));
  const out=[];
  for(const deal of ourDeals()){
    for(const {m,t} of tradesOn(deal,date)){
      const need=t.default_crew_size||0;
      if(need<=0)continue;
      const have=assigns.filter(a=>a.work_date===date&&a.deal_id===deal.id&&a.milestone_key===m.milestone_key).length;
      let gap=need-have;
      if(gap<=0)continue;
      const pool=skilledFor(m.milestone_key)
        .filter(w=>!taken.has(w.id))
        .map(w=>({w, cont:assigns.some(a=>a.worker_id===w.id&&a.deal_id===deal.id&&a.milestone_key===m.milestone_key)?1:0}))
        .sort((a,b)=>(b.cont-a.cont)||(Number(a.w.daily_rate)-Number(b.w.daily_rate)));
      for(const cand of pool){
        if(gap<=0)break;
        out.push({deal_id:deal.id, milestone_key:m.milestone_key, work_date:date, worker_id:cand.w.id,
                  _name:cand.w.name, _trade:nameOf(m), _site:addrOf(deal), _rate:Number(cand.w.daily_rate)});
        taken.add(cand.w.id); gap--;
      }
      if(gap>0)out.push({_short:true, _trade:nameOf(m), _site:addrOf(deal), _gap:gap});
    }
  }
  return out;
}
async function applySuggestion(){
  const plan=suggestFor(selDate).filter(x=>!x._short);
  if(!plan.length){alert('Nothing to suggest — either everything is covered, or nobody is marked for the trades running today.');return;}
  const rows=plan.map(({deal_id,milestone_key,work_date,worker_id})=>({deal_id,milestone_key,work_date,worker_id}));
  const {data,error}=await sb.from('deal_work_assignments').insert(rows)
    .select('id, deal_id, milestone_key, work_date, worker_id');
  if(error){alert('Suggest failed: '+error.message);return;}
  assigns.push(...(data||[]));
  render();
}
window.applySuggestion=applySuggestion;

function render(){
  const d=new Date(selDate+'T00:00:00');
  document.getElementById('dCur').textContent=longDate(selDate);
  document.getElementById('dPick').value=selDate;
  document.getElementById('chSub').textContent=deals.length+(deals.length===1?' build in progress':' builds in progress');

  if(!deals.length){
    document.getElementById('page').innerHTML='<div class="empty">No builds under construction.</div>';
    return;
  }

  let dayCost=0, needTotal=0, gotTotal=0;
  const assignedIds=new Set(assigns.map(a=>a.worker_id));
  let sites='';
  for(const deal of ourDeals()){
    const planned=tradesOn(deal, selDate);
    // Plus any trade someone was actually put on that day, whether or not the
    // plan called for it — assignments can come from project-detail's grid,
    // where every day of every trade is clickable. An assignment with no row
    // here is one you can neither see nor undo.
    const onKeys=new Set(assigns.filter(a=>a.deal_id===deal.id&&a.work_date===selDate).map(a=>a.milestone_key));
    const extra=(milestones||[]).filter(m=>m.deal_id===deal.id && onKeys.has(m.milestone_key)
        && !planned.some(x=>x.m.milestone_key===m.milestone_key))
      .map(m=>({m, t:tplOf(m.milestone_key), off:true}));
    const trades=[...planned, ...extra];
    if(!trades.length)continue;
    let siteCost=0, siteNeed=0, siteGot=0;
    let rows='';
    for(const {m,t,off} of trades){
      const need=t.default_crew_size==null?null:t.default_crew_size;
      const people=assignedTo(deal.id, m.milestone_key);
      siteGot+=people.length;
      // Off-plan work isn't a slot the schedule asked for, so it counts people
      // and cost but not the day's requirement.
      if(need!=null && !off)siteNeed+=need;
      for(const p of people)siteCost+=Number(p.w.daily_rate||0);
      const cls=off?'':(need==null?'':(people.length>=need?'met':'short'));
      const chips=people.map(p=>{
        const dbl=workerDayCount(p.w.id)>1;
        return `<span class="chip${dbl?' dbl':''}" title="${dbl?'Also assigned elsewhere today':''}">${esc(p.w.name)}<span class="rate">${FD(p.w.daily_rate)}</span><span class="x" data-unassign="${p.a.id}">✕</span></span>`;
      }).join('');
      rows+=`<div class="trade">
        <div class="tn">${esc(nameOf(m))}${off?' <span class="offtag">off plan</span>':''}<em>due ${fmtNum(m.due_date)}</em></div>
        <div class="need ${cls}">${people.length}${(need==null||off)?'':' / '+need}</div>
        <div class="chips">${chips}<button class="chip-add" data-assign="${deal.id}|${esc(m.milestone_key)}|${esc(nameOf(m))}">+ assign</button></div>
      </div>`;
    }
    dayCost+=siteCost; needTotal+=siteNeed; gotTotal+=siteGot;
    sites+=`<div class="site">
      <div class="site-h">
        <div>
          <div class="addr"><a href="project-detail.html?deal=${deal.id}">${esc(addrOf(deal))}</a>, <span class="city">${esc(cityOf(deal))}</span></div>
          <div class="meta">day ${daysBetween(startOf(deal),selDate)} · ${trades.length} ${trades.length===1?'trade':'trades'} running${deal.gc_crew?' · '+esc(deal.gc_crew):''}</div>
        </div>
        <div class="rr"><div class="cost">${FD(siteCost)}</div>${siteGot} out · ${siteNeed} asked for by the plan</div>
      </div>
      ${rows}
    </div>`;
  }
  if(!sites)sites='<div class="empty">Nothing on our crew this day.</div>';
  let subs='';
  for(const deal of subDeals()){
    const trades=tradesOn(deal, selDate);
    if(!trades.length)continue;
    subs+=`<div class="site sub">
      <div class="site-h">
        <div>
          <div class="addr"><a href="project-detail.html?deal=${deal.id}">${esc(addrOf(deal))}</a>, <span class="city">${esc(cityOf(deal))}</span>
            <em class="crewtag">${esc(crewName(deal))}</em></div>
          <div class="meta">day ${daysBetween(startOf(deal),selDate)} · ${trades.map(x=>esc(nameOf(x.m))).join(' · ')}</div>
        </div>
        <div class="rr">fixed price<div class="subnote">not staffed from our roster</div></div>
      </div>
    </div>`;
  }

  const bench=workers.filter(w=>!assignedIds.has(w.id));
  const benchHtml=`<div class="bench">
    <div class="sect-h"><h2>Not assigned</h2><span class="sub">${bench.length} of ${workers.length} free on ${fmtNum(selDate)}</span></div>
    ${bench.length?`<div class="chips">${bench.map(w=>`<span class="chip">${esc(w.name)}<span class="rate">${FD(w.daily_rate)}</span></span>`).join('')}</div>`
      :'<div class="none">Everyone is on a site today.</div>'}
  </div>`;

  const dbl=workers.filter(w=>workerDayCount(w.id)>1);
  const dblNote=dbl.length?`<div class="note warn">${dbl.map(w=>esc(w.name)).join(', ')} ${dbl.length===1?'is':'are'} assigned to more than one job today.</div>`:'';

  // Watch-list: every build, whether or not anything runs today.
  let cards='';
  for(const deal of [...deals].sort((a,b)=>slipOf(b).slip-slipOf(a).slip)){
    const st=slipOf(deal);
    const c=costs[deal.id]||{};
    const span=Math.max(st.totalDays||36, st.elapsed||0)||36;
    const frontDay=st.oldest?Math.max(0,daysBetween(st.start,st.oldest.due_date)):span;
    const frontPct=Math.min(100,Math.max(0,frontDay/span*100));
    const nowPct=Math.min(100,Math.max(0,(st.elapsed||0)/span*100));
    const pill=st.slip>7?'bad':(st.slip>0?'warn':'ok');
    const pillTxt=st.slip>0?st.slip+' days behind':'On schedule';
    const prog=st.total?Math.round(st.done/st.total*100):0;
    const bud=(c.rehab_budget&&c.rehab_budget>0)?Math.round((c.rehab_actual||0)/c.rehab_budget*100):0;
    cards+=`<div class="wcard">
      <div class="wcard-h">
        <div class="addr"><a href="project-detail.html?deal=${deal.id}">${esc(addrOf(deal))}</a>${isOurs(deal)?'':`<em class="crewtag">${esc(crewName(deal))}</em>`}</div>
        <span class="pill ${pill}">${pillTxt}</span>
        <div class="rr">day ${st.elapsed} of ${st.totalDays}</div>
      </div>
      <div class="trk">
        <div class="fill" style="width:${frontPct}%"></div>
        ${st.slip>0?`<div class="gap" style="left:${frontPct}%;width:${Math.max(0,nowPct-frontPct)}%"></div>`:''}
        <div class="now" style="left:${nowPct}%"></div>
      </div>
      <div class="wrows">
        <div class="bar"><div class="t"><span class="l">Progress</span><span class="p">${st.done} of ${st.total} · ${prog}%</span></div><div class="tk"><div class="fl" style="width:${prog}%;background:var(--blue)"></div></div></div>
        <div class="bar"><div class="t"><span class="l">Budget</span><span class="p">${FD(c.rehab_actual||0)} / ${c.rehab_budget?FD(c.rehab_budget):'—'} · ${bud}%</span></div><div class="tk"><div class="fl" style="width:${Math.min(100,bud)}%;background:var(--accent)"></div></div></div>
      </div>
      ${st.oldest?`<div class="note">Oldest open · <b>${esc(nameOf(st.oldest))}</b> due ${fmtNum(st.oldest.due_date)}</div>`:''}
    </div>`;
  }

  // What the suggester would do, and where it can't.
  const sugg=suggestFor(selDate);
  const shorts=sugg.filter(x=>x._short);
  const suggNote=shorts.length
    ? `<div class="note warn">Can't fill ${shorts.map(x=>esc(x._trade)+' at '+esc(x._site)+' ('+x._gap+')').join(', ')} — nobody free is marked for ${shorts.length===1?'that trade':'those trades'}.</div>`
    : '';
  const suggestNote=suggNote;
  document.getElementById('page').innerHTML=`
    <div class="strip">
      <div class="cell"><div class="k">Crew out today</div><div class="v">${gotTotal}${needTotal?' / '+needTotal:''}</div><div class="s">${bench.length} still on the bench</div></div>
      <div class="cell"><div class="k">Labor cost</div><div class="v">${FD(dayCost)}</div><div class="s">assigned people, ${fmtNum(selDate)}</div></div>
      <div class="cell"><div class="k">Builds running</div><div class="v">${deals.length}</div><div class="s">${ourDeals().length} on our crew · ${subDeals().length} fixed price</div></div>
      <div class="cell"><div class="k">Worst slip</div><div class="v ${Math.max(...deals.map(d=>slipOf(d).slip))>7?'bad':''}">${Math.max(...deals.map(d=>slipOf(d).slip))} days</div><div class="s">${esc(addrOf([...deals].sort((a,b)=>slipOf(b).slip-slipOf(a).slip)[0]))}</div></div>
    </div>
    <div class="sect-h"><h2>The next two weeks</h2><span class="sub">crew each site needs, per day</span></div>
    ${renderMatrix()}
    <div class="sect-h" style="margin-top:22px"><h2>Who goes where</h2><span class="sub">${longDate(selDate)} · click + assign to put someone on a trade</span>
      <button class="sugg" onclick="applySuggestion()">Suggest crew</button></div>
    ${suggestNote}
    ${sites}
    ${subs}
    ${dblNote}
    ${benchHtml}
    <div class="sect-h"><h2>Crew &amp; skills</h2><span class="sub">click a square to say someone can do that trade</span></div>
    ${renderRoster()}
    <div class="sect-h" style="margin-top:22px"><h2>All builds</h2><span class="sub">sorted by slip, worst first</span></div>
    ${cards}
  `;
  wire();
}

function wire(){
  document.querySelectorAll('.rs-c[data-skill]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const [wid,key]=el.dataset.skill.split('|');
      const cur=skills.find(x=>x.worker_id===wid&&x.milestone_key===key);
      el.classList.toggle('on', !cur);
      if(cur){
        const {error}=await sb.from('worker_trades').delete().eq('id',cur.id);
        if(error){el.classList.add('on');alert('Save failed: '+error.message);return;}
        skills=skills.filter(x=>x.id!==cur.id);
      } else {
        const {data,error}=await sb.from('worker_trades')
          .insert({worker_id:wid, milestone_key:key}).select('id, worker_id, milestone_key');
        if(error){el.classList.remove('on');alert('Save failed: '+error.message);return;}
        if(data&&data[0])skills.push(data[0]);
      }
      render();
    });
  });
  document.querySelectorAll('.mx-c[data-day]').forEach(el=>{
    el.addEventListener('click',()=>setDate(el.dataset.day));
  });
  document.querySelectorAll('[data-unassign]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id=el.dataset.unassign;
      const {error}=await sb.from('deal_work_assignments').delete().eq('id',id);
      if(error){alert('Remove failed: '+error.message);return;}
      assigns=assigns.filter(a=>a.id!==id);
      render();
    });
  });
  document.querySelectorAll('[data-assign]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [dealId,key,label]=el.dataset.assign.split('|');
      openOv(dealId,key,label);
    });
  });
}

function openOv(dealId,key,label){
  ovCtx={dealId,key};
  const deal=deals.find(d=>d.id===dealId);
  document.getElementById('ovTitle').textContent=label;
  document.getElementById('ovSub').textContent=addrOf(deal)+' · '+longDate(selDate);
  renderOvBody();
  document.getElementById('ov').classList.add('open');
}
function renderOvBody(){
  const here=new Set(assigns.filter(a=>a.deal_id===ovCtx.dealId&&a.milestone_key===ovCtx.key).map(a=>a.worker_id));
  document.getElementById('ovBody').innerHTML=workers.map(w=>{
    const elsewhere=assigns.find(a=>a.worker_id===w.id&&!(a.deal_id===ovCtx.dealId&&a.milestone_key===ovCtx.key));
    let st='';
    if(elsewhere){
      const d=deals.find(x=>x.id===elsewhere.deal_id);
      st=`<span class="st">on ${esc(addrOf(d))}</span>`;
    }
    return `<div class="wrow${here.has(w.id)?' on':''}" data-worker="${w.id}">
      <span class="nm">${esc(w.name)}</span>${st}<span class="rt">${FD(w.daily_rate)}</span></div>`;
  }).join('');
  document.querySelectorAll('#ovBody .wrow').forEach(el=>{
    el.addEventListener('click', ()=>toggleWorker(el.dataset.worker));
  });
}
async function toggleWorker(workerId){
  const existing=assigns.find(a=>a.deal_id===ovCtx.dealId&&a.milestone_key===ovCtx.key&&a.worker_id===workerId);
  if(existing){
    const {error}=await sb.from('deal_work_assignments').delete().eq('id',existing.id);
    if(error){alert('Remove failed: '+error.message);return;}
    assigns=assigns.filter(a=>a.id!==existing.id);
  } else {
    const {data,error}=await sb.from('deal_work_assignments')
      .insert({deal_id:ovCtx.dealId, milestone_key:ovCtx.key, work_date:selDate, worker_id:workerId})
      .select('id, deal_id, milestone_key, work_date, worker_id');
    if(error){alert('Assign failed: '+error.message);return;}
    if(data&&data[0])assigns.push(data[0]);
  }
  renderOvBody();
  render();
  document.getElementById('ov').classList.add('open');
}
function closeOv(){document.getElementById('ov').classList.remove('open');ovCtx=null;}
window.closeOv=closeOv;

async function setDate(s){selDate=s;await loadAssignments();render();}
async function setHorizon(mode){
  horizonMode=mode;
  document.getElementById('h2w').classList.toggle('on',mode==='2w');
  document.getElementById('hFull').classList.toggle('on',mode==='full');
  await loadAssignments();
  render();
}

(async()=>{
  await window.authGate();
  if(!window.CURRENT_USER_ROLE)return;
  window.renderSidebar('construction');
  document.getElementById('dPrev').addEventListener('click',()=>setDate(addDays(selDate,-1)));
  document.getElementById('dNext').addEventListener('click',()=>setDate(addDays(selDate,1)));
  document.getElementById('dToday').addEventListener('click',()=>setDate(todayStr()));
  // The nightly job is planning tomorrow, so it gets its own button rather
  // than a step through the date arrows.
  document.getElementById('dTom').addEventListener('click',()=>setDate(addDays(todayStr(),1)));
  document.getElementById('h2w').addEventListener('click',()=>setHorizon('2w'));
  document.getElementById('hFull').addEventListener('click',()=>setHorizon('full'));
  document.getElementById('dPick').addEventListener('change',e=>{if(e.target.value)setDate(e.target.value);});
  await loadAll();
  render();
})();
</script>
</body>
