<script>
const SUPABASE_URL='https://pwrnywsojomrygsiezzi.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3cm55d3Nvam9tcnlnc2llenppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyMzE1OTMsImV4cCI6MjA4OTgwNzU5M30.tGewn18t-6dN_bMXjC-Z820zFYvL1VUu3BDhfW1ZoNk';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
window.sb=sb;

// ---------- formatting + dates (LA calendar days, stored as YYYY-MM-DD) ----------
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const fmt = n => (n < 0 ? '−$' : '$') + Math.abs(Math.round(n || 0)).toLocaleString();
const num = v => +String(v == null ? '' : v).replace(/[^\d.-]/g, '') || 0;
const todayISO = () => new Intl.DateTimeFormat('en-CA', { timeZone:'America/Los_Angeles' }).format(new Date());
const TODAY = todayISO(), CUR_Y = +TODAY.slice(0, 4);
const D = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const ISO = dt => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
const md = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return m + '/' + d + (y !== CUR_Y ? '/' + String(y).slice(2) : ''); };
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dmd = iso => iso ? DOW[D(iso).getDay()] + ' ' + md(iso) : '';
const daysBetween = (a, b) => Math.round((D(b) - D(a)) / 864e5);
const addDays = (iso, n) => { const x = D(iso); x.setDate(x.getDate() + n); return ISO(x); };
const nd = n => n + (n === 1 ? ' day' : ' days');
const span = (a, b) => b ? md(a) + ' → ' + md(b) + ' · ' + nd(daysBetween(a, b)) : a === TODAY ? 'since today' : 'since ' + md(a) + ' · ' + nd(daysBetween(a, TODAY));
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtYM = iso => iso ? MONTHS[+iso.slice(5, 7) - 1] + ' ' + iso.slice(0, 4) : '';
const ymRange = (a, b) => !a ? '' : !b || fmtYM(a) === fmtYM(b) ? fmtYM(a) : a.slice(0, 4) === b.slice(0, 4) ? MONTHS[+a.slice(5, 7) - 1] + ' – ' + fmtYM(b) : fmtYM(a) + ' – ' + fmtYM(b);
function fmtDates(ds) {   // 10/12 → 10/14, 10/16 — a Sunday off doesn't break a run
  const runs = [];
  ds.forEach(d => { const r = runs[runs.length - 1], gap = r ? daysBetween(r[1], d) : 9;
    if (r && (gap === 1 || (gap === 2 && D(r[1]).getDay() === 6))) r[1] = d; else runs.push([d, d]); });
  return runs.map(r => r[0] === r[1] ? md(r[0]) : md(r[0]) + ' → ' + md(r[1])).join(', ');
}
const fmtTime = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); if (isNaN(h)) return t; return (h % 12 || 12) + (m ? ':' + String(m).padStart(2, '0') : '') + (h < 12 ? 'am' : 'pm'); };
const pct = m => (m < 0 ? '−' : '') + Math.abs(m) + '%';
const titleCase = s => String(s || '').toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase());

// ---------- state, loaded from Supabase ----------
let JOBS = [];          // side_jobs rows + tasks, log, QuickBooks money + payments
let WORKERS = [];       // active crew, from `workers` (construction.html's roster)
let WBY = {};           // worker id → { name, daily_rate }, including retired ones (old days still name them)
let FLIP_DAYS = [];     // { worker_id, work_date, label } — the flips' crew plan, for clashes
let CUSTOMERS = [];     // QuickBooks side-project customers: { id, name, last } (for linking a job)
const STAGES = [{ k:'lead', label:'Lead' }, { k:'quoted', label:'Quoted' }, { k:'active', label:'Job' }, { k:'lost', label:'Lost' }];
const RAIL = STAGES.slice(0, 3);
const BOARD = [{ k:'lead', label:'Lead', cls:'col-lead' }, { k:'quoted', label:'Quoted', cls:'col-quoted' }, { k:'active', label:'Jobs', cls:'col-active' }];

function must(res, what) {
  if (res && res.error) { console.error(what, res.error); throw new Error((what ? what + ': ' : '') + res.error.message); }
  return res ? res.data : null;
}
function toast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 5000);
}
// Every write goes through here: on failure say so and reload what the database has.
async function write(what, fn) {
  try { await fn(); }
  catch (e) { toast('Couldn’t save — ' + (e.message || e)); }
  await loadAll(); render();
}

async function loadAll() {
  const lo = TODAY, hi = addDays(TODAY, 180);
  const [jobs, tasks, days, log, money, pays, workers, assigns] = await Promise.all([
    sb.from('side_jobs').select('*').order('came_in', { ascending:false }),
    sb.from('side_job_tasks').select('*').order('sort_order'),
    sb.from('side_job_task_days').select('task_id, work_date, worker_ids'),
    sb.from('side_job_log').select('*').order('entry_date', { ascending:false }).order('created_at', { ascending:false }),
    sb.from('side_project_money_v1').select('qbo_customer_id, customer_name, year, income, labor, materials, soft, other, first_date, last_date'),
    sb.from('side_project_payments_v1').select('qbo_customer_id, txn_date, amount, deposited_to, description').order('txn_date'),
    sb.from('workers').select('id, name, daily_rate, active').order('name'),
    sb.from('deal_work_assignments').select('deal_id, work_date, worker_id').gte('work_date', lo).lte('work_date', hi),
  ]);
  [jobs, tasks, days, log, money, pays, workers, assigns].forEach((r, i) => must(r, ['side_jobs', 'tasks', 'task days', 'log', 'money', 'payments', 'workers', 'flip schedule'][i]));
  WORKERS = workers.data.filter(w => w.active);
  WBY = Object.fromEntries(workers.data.map(w => [w.id, w]));
  // Flip labels: deal → buy-side MLS → property street
  const dealIds = [...new Set(assigns.data.map(a => a.deal_id))];
  let label = {};
  if (dealIds.length) {
    const deals = must(await sb.from('deals').select('id, buy_side_mls').in('id', dealIds), 'deals');
    const mlss = deals.map(d => d.buy_side_mls).filter(Boolean);
    const props = mlss.length ? must(await sb.from('properties').select('mls, address').in('mls', mlss), 'properties') : [];
    const addr = Object.fromEntries(props.map(p => [p.mls, p.address]));
    label = Object.fromEntries(deals.map(d => [d.id, titleCase((addr[d.buy_side_mls] || 'a flip').replace(/^\d+\s+/, ''))]));
  }
  FLIP_DAYS = assigns.data.map(a => ({ worker_id:a.worker_id, work_date:a.work_date, label:label[a.deal_id] || 'a flip' }));
  // QuickBooks money per customer (sum of its years) + the current year's slice
  const byCust = {};
  money.data.forEach(r => {
    const c = byCust[r.qbo_customer_id] = byCust[r.qbo_customer_id] || { name:r.customer_name, income:0, labor:0, materials:0, soft:0, other:0, first:null, last:null, y:{} };
    ['income', 'labor', 'materials', 'soft', 'other'].forEach(k => c[k] += +r[k]);
    if (!c.first || r.first_date < c.first) c.first = r.first_date;
    if (!c.last || r.last_date > c.last) c.last = r.last_date;
    if (r.customer_name && r.customer_name.includes(':')) c.name = r.customer_name;
    c.y[r.year] = { income:+r.income, spent:+r.labor + +r.materials + +r.soft + +r.other };
  });
  const paysBy = {};
  pays.data.forEach(p => (paysBy[p.qbo_customer_id] = paysBy[p.qbo_customer_id] || []).push(p));
  const daysBy = {};
  days.data.forEach(d => (daysBy[d.task_id] = daysBy[d.task_id] || []).push(d));
  JOBS = jobs.data.map(j => Object.assign(j, {
    tasks: tasks.data.filter(t => t.job_id === j.id).map(t => {
      const ds = (daysBy[t.id] || []).sort((a, b) => a.work_date < b.work_date ? -1 : 1);
      return Object.assign(t, { dates: ds.map(d => d.work_date), crewByDay: Object.fromEntries(ds.map(d => [d.work_date, d.worker_ids || []])) });
    }),
    log: log.data.filter(l => l.job_id === j.id),
    money: j.qbo_customer_id ? byCust[j.qbo_customer_id] || null : null,
    pays: j.qbo_customer_id ? paysBy[j.qbo_customer_id] || [] : [],
  }));
  JOBS.forEach(j => sortTasks(j));
  const linked = new Set(JOBS.map(j => j.qbo_customer_id).filter(Boolean));
  CUSTOMERS = Object.entries(byCust).filter(([id]) => !linked.has(id)).map(([id, c]) => ({ id, name:c.name, last:c.last }))
    .sort((a, b) => (b.last || '').localeCompare(a.last || ''));
}

// ---------- what a job adds up to ----------
const wonLines = j => (j.quote_lines || []).filter(l => !l.declined);
const changeOrders = j => j.log.filter(l => l.kind === 'change_order').sort((a, b) => (a.co_no || 0) - (b.co_no || 0));
const qTotals = lines => { const ls = lines.filter(l => !l.declined); return { price: ls.reduce((a, l) => a + num(l.price), 0), cost: ls.reduce((a, l) => a + num(l.cost), 0) }; };
const contract = j => qTotals(j.quote_lines || []).price + changeOrders(j).reduce((a, c) => a + num(c.price), 0);
const quotedCost = j => qTotals(j.quote_lines || []).cost + changeOrders(j).reduce((a, c) => a + num(c.cost), 0);
const paid = j => j.money ? j.money.income : 0;
const spent = j => j.money ? j.money.labor + j.money.materials + j.money.soft + j.money.other : 0;
const paidUp = j => j.from_qbo ? !!j.work_done_on : !!(j.work_done_on && contract(j) && paid(j) >= contract(j));
const isOpen = j => ['lead', 'quoted'].includes(j.stage) || (j.stage === 'active' && !paidUp(j));
const onBoard = j => !j.archived_at && isOpen(j);
const shortName = j => j.client_name.split(' ').pop();
const firstDay = j => j.tasks.flatMap(x => x.dates).sort()[0];
const entered = j => ({ lead:j.came_in, quoted:j.quote_sent_on, active:j.won_on, lost:j.lost_on });
const dueFollow = j => j.log.find(l => l.kind === 'follow_up' && l.due);
function sortTasks(j) { j.tasks.sort((a, b) => (a.dates[0] || '9999') .localeCompare(b.dates[0] || '9999') || (a.not_billed - b.not_billed) || a.sort_order - b.sort_order); }

// ---------- crew ----------
const wname = id => (WBY[id] || {}).name || '?';
const rateOf = id => +((WBY[id] || {}).daily_rate || 0);
const dayCrew = (x, d) => (x.crewByDay && x.crewByDay[d]) || [];
const crewOf = x => [...new Set(x.dates.flatMap(d => dayCrew(x, d)))];
const crewCost = x => x.dates.reduce((a, d) => a + dayCrew(x, d).reduce((b, w) => b + rateOf(w), 0), 0);
const taskCost = x => crewCost(x) + (x.sub_name && x.sub_cost ? +x.sub_cost : 0);   // what the task costs us in people: crew days + the sub's price
const laborProj = x => x.labor_est != null ? +x.labor_est : taskCost(x);   // a typed labor number wins; otherwise the crew schedule's
function busyOn(jobId, w, d) {   // is this person somewhere else that day?
  const f = FLIP_DAYS.find(a => a.worker_id === w && a.work_date === d);
  if (f) return 'on ' + f.label;
  for (const j of JOBS) if (j.id !== jobId && j.stage === 'active' && !j.work_done_on && j.tasks.some(x => !x.done && dayCrew(x, d).includes(w))) return 'on ' + shortName(j);
  return '';
}
function busyFor(jobId, x, w) {   // first clash for this person on any of the days they're on this task
  for (const d of x.dates) if (d >= TODAY && dayCrew(x, d).includes(w)) { const b = busyOn(jobId, w, d); if (b) return b + ' ' + md(d); }
  return '';
}
function jobClashes(j) {   // this job's people who are booked elsewhere the same day, from today on
  const by = {};
  j.tasks.filter(x => !x.done).forEach(x => x.dates.filter(d => d >= TODAY).forEach(d => dayCrew(x, d).forEach(w => {
    const other = busyOn(j.id, w, d); if (!other) return;
    const c = by[other] = by[other] || { other:other.replace(/^on /, ''), workers:new Set(), days:[] };
    c.workers.add(wname(w)); if (!c.days.includes(d)) c.days.push(d);
  })));
  return Object.values(by).map(c => (c.days.sort(), c));
}

// ---------- board ----------
let selected = null, viewStage = null;
let SETUP = null, EDITING = false, RELINK = false, QEDIT = null;   // … · job whose won quote is being edited   // job being set up from QuickBooks · details form open · QuickBooks picker reopened
const sel = () => JOBS.find(x => x.id === selected);
function spentBar(j) {   // spent (QuickBooks) against the quoted cost
  const qc = quotedCost(j), s = spent(j), pct = qc ? s / qc : null, fill = pct == null ? '' : pct > 1 ? 'over' : !j.work_done_on && pct > .85 ? 'warn' : 'ontrack';
  return '<div class="card-bar"><div class="card-bar-cap"><span class="cb-lbl">' + (pct == null ? 'Spent' : 'Spent vs quoted cost') + '</span><span class="cb-num">' +
    (pct == null ? fmt(s) + ' · no quote yet' : fmt(s) + ' / ' + fmt(qc) + ' · ' + Math.round(pct * 100) + '%') + '</span></div>' +
    '<div class="card-bar-track"><div class="card-bar-fill ' + fill + '" style="width:' + Math.min(100, Math.round((pct || 0) * 100)) + '%"></div></div></div>';
}
function leadNext(j) {
  if (j.visit_notes) return ['Write the quote', 'soon'];
  if (j.visit_date) return ['Site visit ' + dmd(j.visit_date) + (j.visit_time ? ', ' + fmtTime(j.visit_time) : ''), j.visit_date < TODAY ? 'due' : 'soon'];
  return ['Schedule a site visit', 'soon'];
}
function cardHtml(j) {
  const head = (right, cls) => '<div class="card-row"><span class="addr">' + esc(j.client_name) + '</span><span class="price' + (cls ? ' ' + cls : '') + '">' + right + '</span></div>';
  const bot = (l, r, rcls) => '<div class="card-row bot"><span class="sub">' + esc(l) + '</span><span class="age' + (rcls ? ' ' + rcls : '') + '">' + r + '</span></div>';
  let h = '';
  if (j.stage === 'lead') { const [n, c] = leadNext(j); h = head(j.budget ? esc(j.budget) + ' budget' : '') + bot(j.address, esc(n), c); }
  else if (j.stage === 'quoted') {
    const due = dueFollow(j);
    h = head(fmt(contract(j))) + bot(j.address, 'sent ' + md(j.quote_sent_on) + (due ? ' · follow up ' + md(due.entry_date) : ''), due ? (due.entry_date < TODAY ? 'due' : 'soon') : '');
  } else if (j.work_done_on) {   // work's finished, money isn't all in
    const owed = contract(j) - paid(j), since = daysBetween(j.work_done_on, TODAY), late = since > 14;
    h = head(fmt(owed) + ' owed', late ? 'due' : '') + bot(j.address, 'work done ' + md(j.work_done_on) + (late ? ' · ' + nd(since) + ' ago' : ''), late ? 'due' : '') + spentBar(j);
  } else {
    const first = firstDay(j);
    const age = j.from_qbo ? 'since ' + fmtYM(j.money && j.money.first || j.came_in) : !first ? 'not scheduled' : first > TODAY ? 'starts ' + md(first) : daysBetween(first, TODAY) + 'd in build';
    h = head(contract(j) ? fmt(contract(j)) : 'no quote') + bot(j.address, age) + spentBar(j) +
      jobClashes(j).map(c => '<div class="card-clash">' + [...c.workers].join(' & ') + ' also on ' + esc(c.other) + ' · ' + fmtDates(c.days) + '</div>').join('');
  }
  return '<a class="card" href="#" data-open="' + j.id + '">' + h + '</a>';
}
function renderJobs() {
  const open = JOBS.filter(onBoard);
  document.getElementById('board').innerHTML = BOARD.map(c => {
    const rank = j => !j.work_done_on ? 0 : 1, due = j => (dueFollow(j) || {}).entry_date || '9999';
    const js = open.filter(j => j.stage === c.k).sort(c.k === 'quoted' ? (a, b) => due(a).localeCompare(due(b)) || (a.quote_sent_on || '').localeCompare(b.quote_sent_on || '')
      : (a, b) => rank(a) - rank(b) || (a.work_done_on || '').localeCompare(b.work_done_on || ''));
    return '<div class="col ' + c.cls + '"><div class="col-hdr"><span class="name">' + c.label + '</span><span class="cnt">' + js.length + '</span></div>' +
      '<div class="col-body">' + (js.length ? js.map(cardHtml).join('') : '<div class="col-empty">Nothing here</div>') + '</div></div>';

// ---------- QuickBooks sync bar (same as project-detail; owner only) ----------
const QBO_SYNC = { req:null, runs:[], err:null, timer:null, wired:false, note:null, _started:false };
const QS_POLL_ACTIVE_MS = 10000, QS_POLL_IDLE_MS = 60000, QS_CLOCK_SLACK_MS = 120000;
function _qsAgo(iso) {
  if (!iso) return 'never';
  const m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  return h < 48 ? h + 'h ago' : Math.round(h / 24) + 'd ago';
}
const _qsT = iso => iso ? new Date(iso).getTime() : null;
function qboSyncState() {
  const r = QBO_SYNC.req || {}, runs = QBO_SYNC.runs || [], lastOk = runs.find(x => x.status === 'ok'), now = Date.now();
  const reqT = _qsT(r.sync_requested_at), startT = _qsT(r.sync_started_at);
  const nightlyRunning = runs.find(x => x.status === 'running' && now - _qsT(x.started_at) < 30 * 60000);
  if (reqT && (!startT || startT < reqT)) return { state: now - reqT > 5 * 60000 ? 'stuck' : 'requested', lastOk, reqT };
  if (startT) {
    const run = runs.slice().reverse().find(x => _qsT(x.started_at) >= startT - QS_CLOCK_SLACK_MS);
    if (!run) { if (now - startT < 10 * 60000) return { state:'running', lastOk }; }
    else if (run.status === 'running') return { state: now - _qsT(run.started_at) > 20 * 60000 ? 'stuck' : 'running', lastOk, run };
    else if (now - (_qsT(run.ended_at) || now) < 30 * 60000) return { state: run.status === 'ok' ? 'done' : 'failed', lastOk, run };
  }
  if (nightlyRunning) return { state:'running', lastOk, run:nightlyRunning, nightly:true };
  return { state:'idle', lastOk };
}
function qboSyncInner() {
  if (QBO_SYNC.err && !QBO_SYNC.req) return '<span class="qs-msg">QBO sync status unavailable</span>';
  if (!QBO_SYNC.req) return '<span class="qs-msg">QBO sync status…</span>';
  const st = qboSyncState(), last = st.lastOk ? 'QBO last synced ' + _qsAgo(st.lastOk.ended_at) : 'QBO not synced yet';
  let msg = last, cls = '', btn = true, label = 'Sync QBO now';
  if (st.state === 'requested') { msg = 'Requested — waiting for the Mac mini (up to a minute)…'; btn = false; label = 'Requested'; }
  else if (st.state === 'running') { msg = st.nightly ? 'Nightly QBO sync running…' : 'Syncing QuickBooks… usually 1–2 min'; btn = false; label = 'Syncing…'; }
  else if (st.state === 'stuck') { msg = 'The Mac mini hasn’t finished this — it may be asleep. The 04:00 sync will still run. ' + last; cls = 'warn'; btn = false; label = 'Waiting'; }
  else if (st.state === 'done') {
    const fresh = _qsT(st.run && st.run.ended_at) > (window.__qsLoadedAt || 0);
    msg = '✓ QBO synced ' + _qsAgo(st.run.ended_at) + (fresh ? ' — <span class="qs-link" data-qbosync-reload>show new numbers</span>' : ''); cls = 'good';
  } else if (st.state === 'failed') { msg = 'QBO sync failed ' + _qsAgo(st.run && st.run.ended_at) + ' — the alert is in Slack. ' + last; cls = 'bad'; }
  if (QBO_SYNC.note) msg = QBO_SYNC.note + ' · ' + msg;
  return '<span class="qs-msg ' + cls + '">' + msg + '</span><button type="button" class="qs-btn" data-qbosync-btn' + (btn ? '' : ' disabled') + '>' + label + '</button>';
}
const qboSyncBarHtml = () => window.CURRENT_USER_ROLE === 'owner' ? '<div class="qbo-sync" data-qbosync>' + qboSyncInner() + '</div>' : '';
const paintQboSync = () => document.querySelectorAll('[data-qbosync]').forEach(el => { el.innerHTML = qboSyncInner(); });
async function refreshQboSync() {
  QBO_SYNC.timer = null;
  if (window.CURRENT_USER_ROLE !== 'owner') return;
  if (!document.hidden || !QBO_SYNC.req) {
    try {
      const [{ data:req, error:e1 }, { data:runs, error:e2 }] = await Promise.all([
        sb.from('qbo_sync_request').select('sync_requested_at, sync_started_at').eq('id', 1).maybeSingle(),
        sb.from('job_runs').select('status, started_at, ended_at, mode').eq('job', 'qbo_sync').neq('status', 'skipped').order('started_at', { ascending:false }).limit(10),
      ]);
      if (e1 || e2) throw (e1 || e2);
      QBO_SYNC.req = req || {}; QBO_SYNC.runs = runs || []; QBO_SYNC.err = null;
    } catch (e) { QBO_SYNC.err = e; }
    paintQboSync();
  }
  const s = QBO_SYNC.req ? qboSyncState().state : 'idle';
  QBO_SYNC.timer = setTimeout(refreshQboSync, ['requested', 'running', 'stuck'].includes(s) ? QS_POLL_ACTIVE_MS : QS_POLL_IDLE_MS);
}
async function _qboSyncClick(e) {
  if (e.target.closest('[data-qbosync-reload]')) { QBO_SYNC.note = null; window.__qsLoadedAt = Date.now(); await loadAll(); render(); return; }
  const b = e.target.closest('[data-qbosync-btn]');
  if (!b || b.disabled) return;
  b.disabled = true; b.textContent = 'Requesting…';
  try {
    const { data, error } = await sb.rpc('request_qbo_sync');
    if (error) throw error;
    const why = { pending:'Already requested', running:'A sync is already running', cooldown:'Synced moments ago — try again in ' + Math.ceil(((data && data.retry_after_s) || 60) / 60) + ' min' };
    QBO_SYNC.note = (data && data.accepted) ? null : (why[data && data.reason] || 'Not accepted');
  } catch (err) { QBO_SYNC.note = (err && err.code === '42501') ? 'Only an owner can sync QBO' : 'Could not request a sync'; }
  if (QBO_SYNC.timer) { clearTimeout(QBO_SYNC.timer); QBO_SYNC.timer = null; }
  await refreshQboSync();
  setTimeout(() => { QBO_SYNC.note = null; paintQboSync(); }, 8000);
}
function wireQboSync() {
  if (window.CURRENT_USER_ROLE !== 'owner') return;
  if (!QBO_SYNC.wired) { document.addEventListener('click', _qboSyncClick); QBO_SYNC.wired = true; }
  if (QBO_SYNC.timer === null && !QBO_SYNC._started) { QBO_SYNC._started = true; refreshQboSync(); } else paintQboSync();
}

  if (e.target.closest('[data-ntcancel]')) { e.target.closest('.noteform').remove(); return; }
  if (!e.target.closest('[data-ntsave]')) return;
  const form = e.target.closest('.noteform'), kind = form.dataset.kind, v = c => ((form.querySelector(c) || {}).value || '').trim();
  if (kind === 'resched' ? !v('.nt-d') : !v('.nt-t')) { form.querySelector(kind === 'resched' ? '.nt-d' : '.nt-t').focus(); return; }
  const now = new Date().toISOString();
  write(kind, async () => {
    if (kind === 'follow') {
      must(await sb.from('side_job_log').insert({ job_id:j.id, kind:'follow_up', entry_date:v('.nt-d') || TODAY, body:v('.nt-t'), created_by:uid() }));
      if (v('.nt-n')) {   // a new follow-up date replaces the old one
        must(await sb.from('side_job_log').delete().eq('job_id', j.id).eq('kind', 'follow_up').eq('due', true));
        must(await sb.from('side_job_log').insert({ job_id:j.id, kind:'follow_up', entry_date:v('.nt-n'), body:'Follow-up due', due:true, created_by:uid() }));
      }
    } else if (kind === 'log') must(await sb.from('side_job_log').insert({ job_id:j.id, kind:'note', entry_date:v('.nt-d') || TODAY, body:v('.nt-t'), created_by:uid() }));
    else if (kind === 'material') must(await sb.from('side_job_log').insert({ job_id:j.id, kind:'material', entry_date:TODAY, body:v('.nt-t'), material_status:v('.nt-s') || 'to order', created_by:uid() }));
    else if (kind === 'task') must(await sb.from('side_job_tasks').insert({ job_id:j.id, name:v('.nt-t'), not_billed:true, sort_order:j.tasks.length }));
    else if (kind === 'visit') must(await sb.from('side_jobs').update({ visit_notes:v('.nt-t'), visit_date:j.visit_date || TODAY, updated_at:now }).eq('id', j.id));
    else if (kind === 'resched') must(await sb.from('side_jobs').update({ visit_date:v('.nt-d'), visit_time:v('.nt-tm') || null, visit_who:v('.nt-t') || null, updated_at:now }).eq('id', j.id));
  });
});

function showDrawer() { document.getElementById('boardView').hidden = true; document.getElementById('detailView').hidden = false; window.scrollTo(0, 0); }
function closeDrawer() {
  selected = null; nj = null; ED = null;
  document.getElementById('detailView').hidden = true; document.getElementById('boardView').hidden = false;
  SETUP = null; EDITING = false; RELINK = false;
  if (location.search) history.pushState(null, '', location.pathname);
  renderJobs();
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.getElementById('listOverlay').classList.contains('open')) closeList();
  else if (document.getElementById('wonOverlay').classList.contains('open')) closeWon();
  else if (document.getElementById('lostOverlay').classList.contains('open')) closeLost();
  else if (!ED && (selected || nj)) closeDrawer();
});

// ---------- + New job: intake form → creates a Lead ----------
const SOURCES = ['Referral', 'Repeat client', 'Yelp', 'Google', 'Nextdoor', 'Saw our sign', 'Other'];
let nj = null;   // the form's state
function openNewJob() {
  selected = null; renderJobs();
  document.getElementById('stageTabs').innerHTML = ''; document.getElementById('topbarExtra').innerHTML = '';
  nj = { source:null, match:null };
  const pastClients = JOBS.filter(j => j.stage === 'active').filter((j, i, a) => a.findIndex(x => x.client_name === j.client_name) === i);
  document.getElementById('drawer').innerHTML =
    '<div class="dw-h"><div class="top"><h3>New job</h3><button class="x" onclick="closeDrawer()">×</button></div>' +
    '<div class="meta" style="color:var(--text-4)">Starts as a lead. You can write the quote now or after the site visit.</div></div>' +
    '<div class="dw-s nf"><h4>Client</h4>' +
      '<label>Name<input id="njName" placeholder="e.g. Grace Wong" autocomplete="off"></label>' +
      '<div id="njMatch"></div>' +
      '<div class="nf2"><label>Phone<input id="njPhone" placeholder="(626) 555-0100"></label><label>Email<input id="njEmail" placeholder="optional"></label></div>' +
      '<label>Job address<input id="njAddr" placeholder="Street, city"></label>' +
    '</div>' +
    '<div class="dw-s nf"><h4>What they want</h4>' +
      '<label class="bare"><textarea id="njAsk" rows="3" placeholder="In their words — e.g. “Guest bath refresh: new vanity + toilet, regrout the tub. Wants it done before Thanksgiving.”"></textarea></label>' +
      '<label style="max-width:200px">Budget they mentioned<input id="njBudget" placeholder="optional, e.g. ~$10k"></label>' +
    '</div>' +
    '<div class="dw-s nf"><h4>How they found us</h4>' +
      '<div class="srcs">' + SOURCES.map(x => '<button type="button" class="src" data-src="' + x + '">' + x + '</button>').join('') + '</div>' +
      '<label id="njRefWrap" style="display:none;max-width:260px">Referred by<select id="njRef"><option value="">Pick a past client…</option>' +
        pastClients.map(j => '<option>' + esc(j.client_name) + '</option>').join('') + '<option>Someone else</option></select></label>' +
    '</div>' +
    '<div class="dw-s nf"><h4>Site visit <span class="r">optional</span></h4>' +
      '<div class="nf3"><label>Date<input type="date" id="njDate"></label><label>Time<input type="time" id="njTime"></label>' +
      '<label>Who’s going<input id="njWho" value="Patty"></label></div>' +
      '<div class="q">Leave the date empty to just log the lead.</div>' +
    '</div>' +
    '<div class="nf-acts"><span class="nf-err" id="njErr"></span><button class="btn" onclick="closeDrawer()">Cancel</button>' +
      '<button class="btn" onclick="createJob(true)">Create + write quote →</button><button class="btn pri" onclick="createJob(false)">Create lead</button></div>';
  showDrawer();
  setTimeout(() => { const n = document.getElementById('njName'); if (n) n.focus(); }, 220);
}
document.getElementById('newJob').addEventListener('click', openNewJob);
// Repeat client: typing a name we've worked for offers to fill in their details.
document.getElementById('drawer').addEventListener('input', e => {
  if (e.target.id !== 'njName' || !nj) return;
  const q = e.target.value.trim().toLowerCase(), box = document.getElementById('njMatch');
  const hit = q.length >= 3 && JOBS.find(j => j.client_name.toLowerCase().includes(q));
  nj.match = hit || null;
  box.innerHTML = hit ? '<div class="match"><span><b>' + esc(hit.client_name) + '</b> · ' + esc(hit.address || '') + ' · ' +
      (hit.stage === 'active' && !isOpen(hit) ? 'past client' : 'open job') + '</span><button type="button" class="btn" id="njUse">Use their info</button></div>' : '';
});
document.getElementById('drawer').addEventListener('click', e => {
  if (!nj) return;
  if (e.target.id === 'njUse') {
    const j = nj.match;
    document.getElementById('njName').value = j.client_name;
    document.getElementById('njPhone').value = j.phone || '';
    document.getElementById('njEmail').value = j.email || '';
    document.getElementById('njAddr').value = j.address || '';
    pickSource('Repeat client');
    document.getElementById('njMatch').innerHTML = '<div class="match ok">Filled in from ' + esc(j.client_name) + '’s earlier job.</div>';
  }
  const b = e.target.closest('.src'); if (b) pickSource(b.dataset.src);
});
function pickSource(x) {
  nj.source = x;
  document.querySelectorAll('#drawer .src').forEach(b => b.classList.toggle('on', b.dataset.src === x));
  document.getElementById('njRefWrap').style.display = x === 'Referral' ? '' : 'none';
}
async function createJob(toQuote) {
  const v = id => document.getElementById(id).value.trim();
  const name = v('njName'), addr = v('njAddr'), ask = v('njAsk');
  const miss = [!name && 'name', !addr && 'address', !ask && 'what they want'].filter(Boolean);
  if (miss.length) { document.getElementById('njErr').textContent = 'Need ' + miss.join(', ') + '.'; return; }
  const src = nj.source === 'Referral' && v('njRef') ? 'Referral · ' + v('njRef') : (nj.source || null);
  const date = v('njDate') || null;
  const r = await sb.from('side_jobs').insert({ stage:'lead', client_name:name, address:addr, phone:v('njPhone') || null, email:v('njEmail') || null,
    came_in:TODAY, source:src, ask, budget:v('njBudget') || null, visit_date:date, visit_time:date ? v('njTime') || null : null, visit_who:date ? v('njWho') || null : null,
    created_by:uid() }).select('id').single();
  if (r.error) { document.getElementById('njErr').textContent = 'Couldn’t save — ' + r.error.message; return; }
  nj = null;
  await loadAll();
  openDrawer(r.data.id);
  if (toQuote) { viewStage = 'quoted'; ensureDraft(sel()); renderDrawer(); setTimeout(() => { const q = document.querySelector('#drawer .qh'); if (q) q.focus(); }, 220); }
}

// ---------- start ----------
(async () => {
  await window.authGate();
  if (!window.CURRENT_USER_ROLE) return;   // authGate redirected
  window.renderSidebar('sideprojects');
  window.__qsLoadedAt = Date.now();
  try { await loadAll(); }
  catch (e) { document.getElementById('board').innerHTML = '<div class="col-empty">Couldn’t load side projects — ' + esc(e.message) + '</div>'; return; }
  renderJobs();
  const id = new URLSearchParams(location.search).get('job');
  if (id && JOBS.some(j => j.id === id)) openDrawer(id);
})();
</script>
